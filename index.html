ass=\"v\">9<\/sup> He said to them, “Full well do you reject the commandment of God, that you may keep your tradition. <sup class=\"v\">10<\/sup> For Moses said, ‘Honor your father and your mother;’ and, ‘He who speaks evil of father or mother, let him be put to death.’ <sup class=\"v\">11<\/sup> But you say, ‘If a man tells his father or his mother, “Whatever profit you might have received from me is Corban,” ’ ” that is to say, given to God, <sup class=\"v\">12<\/sup> “then you no longer allow him to do anything for his father or his mother, <sup class=\"v\">13<\/sup> making void the word of God by your tradition, which you have handed down. You do many things like this.”"},{"type":"q","id":"7.1","field":"q52","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The religious leaders worried about washed hands, but Jesus quoted, “This people honors me with their lips, but their heart is far from me” (v. 6). Where might your words and your heart not match?"},{"type":"q","id":"7.2","field":"q53","text":"<b>Action:<\/b> Which traditions in your life help you draw near to God? Are there any that have become more important than God himself? What will you change?"},{"type":"h2","text":"What Makes a Person Unclean"},{"type":"img","src":"img/mark07-v14.jpg","w":1100,"h":733,"alt":"Many hands of different skin tones forming a red heart"},{"type":"p","html":"<sup class=\"v\">14<\/sup> He called all the multitude to himself, and said to them, “Hear me, all of you, and understand. <sup class=\"v\">15<\/sup> There is nothing from outside of the man, that going into him can defile him; but the things which proceed out of the man are those that defile the man. <sup class=\"v\">16<\/sup> If anyone has ears to hear, let him hear!”"},{"type":"p","html":"<sup class=\"v\">17<\/sup> When he had entered into a house away from the multitude, his disciples asked him about the parable. <sup class=\"v\">18<\/sup> He said to them, “Are you also without understanding? Don’t you perceive that whatever goes into the man from outside can’t defile him, <sup class=\"v\">19<\/sup> because it doesn’t go into his heart, but into his stomach, then into the latrine, making all foods clean?” <sup class=\"v\">20<\/sup> He said, “That which proceeds out of the man, that defiles the man. <sup class=\"v\">21<\/sup> For from within, out of the hearts of men, proceed evil thoughts, adulteries, sexual sins, murders, thefts, <sup class=\"v\">22<\/sup> covetings, wickedness, deceit, lustful desires, an evil eye, blasphemy, pride, and foolishness. <sup class=\"v\">23<\/sup> All these evil things come from within, and defile the man.”"},{"type":"q","id":"7.3","field":"q54","text":"<b>Head:<\/b> Consider the image of the heart. Jesus taught that what defiles a person comes “from within, out of the hearts of men” (v. 21). Why does Jesus say the real problem is inside us rather than outside? What does it mean to you that he cares most about the heart?"},{"type":"h2","text":"A Mother’s Faith"},{"type":"img","src":"img/mark07-v24.jpg","w":1100,"h":733,"alt":"A mother kissing her daughter on a city street"},{"type":"p","html":"<sup class=\"v\">24<\/sup> From there he arose, and went away into the borders of Tyre and Sidon. He entered into a house, and didn’t want anyone to know it, but he couldn’t escape notice. <sup class=\"v\">25<\/sup> For a woman, whose little daughter had an unclean spirit, having heard of him, came and fell down at his feet. <sup class=\"v\">26<\/sup> Now the woman was a Greek, a Syrophoenician by race. She begged him that he would cast the demon out of her daughter. <sup class=\"v\">27<\/sup> But Jesus said to her, “Let the children be filled first, for it is not appropriate to take the children’s bread and throw it to the dogs.”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> But she answered him, “Yes, Lord. Yet even the dogs under the table eat the children’s crumbs.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> He said to her, “For this saying, go your way. The demon has gone out of your daughter.”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> She went away to her house, and found the child having been laid on the bed, with the demon gone out."},{"type":"q","id":"7.4","field":"q55","text":"<b>Action:<\/b> Look at the image of the mother and daughter. The woman answered Jesus, “Yes, Lord. Yet even the dogs under the table eat the children’s crumbs” (v. 28). What do you admire about her persistence? What will you keep bringing to God in prayer this week?"},{"type":"q","id":"7.5","field":"q56","text":"<b>Head:<\/b> This mother was an outsider by race and religion, yet Jesus answered her request. Why is that significant? Who are the outsiders in your world, and how might Jesus see them?"},{"type":"h2","text":"Jesus Heals a Deaf Man"},{"type":"img","src":"img/mark07-v31.jpg","w":1100,"h":729,"alt":"A girl resting her face on her hand and listening closely"},{"type":"p","html":"<sup class=\"v\">31<\/sup> Again he departed from the borders of Tyre and Sidon, and came to the sea of Galilee, through the middle of the region of Decapolis. <sup class=\"v\">32<\/sup> They brought to him one who was deaf and had an impediment in his speech. They begged him to lay his hand on him. <sup class=\"v\">33<\/sup> He took him aside from the multitude, privately, and put his fingers into his ears, and he spat, and touched his tongue. <sup class=\"v\">34<\/sup> Looking up to heaven, he sighed, and said to him, “Ephphatha!” that is, “Be opened!” <sup class=\"v\">35<\/sup> Immediately his ears were opened, and the impediment of his tongue was released, and he spoke clearly. <sup class=\"v\">36<\/sup> He commanded them that they should tell no one, but the more he commanded them, so much the more widely they proclaimed it. <sup class=\"v\">37<\/sup> They were astonished beyond measure, saying, “He has done all things well. He makes even the deaf hear, and the mute speak!”"},{"type":"q","id":"7.6","field":"q57","text":"<b>Heart:<\/b> Consider the image of the child listening. Jesus took the man aside, touched his ears and said, “Ephphatha!” which means, “Be opened!” (v. 34). What needs to be opened in you so that you can hear God more clearly?"},{"type":"q","id":"7.7","field":"q58","text":"<b>Action:<\/b> The crowd said, “He has done all things well” (v. 37). Where have you seen Jesus do things well in your life? Who could you tell about it this week?"},{"type":"q","id":"7.8","field":"q59","text":"<b>Heart:<\/b> Select one image from this chapter. If an image is worth a thousand words, what words would you put with this one?"}],"prayer":"God, you look at the heart, not only at what others can see (7:6, 21). Give me wisdom as I read, and make my heart clean and honest before you."},{"num":8,"hero":{"src":"img/mark08-hero.jpg","w":1100,"h":730,"alt":"Golden fields of grain at sunset"},"blocks":[{"type":"h2","text":"Jesus Feeds Four Thousand"},{"type":"p","html":"<sup class=\"v\">1<\/sup> In those days, when there was a very great multitude, and they had nothing to eat, Jesus called his disciples to himself, and said to them, <sup class=\"v\">2<\/sup> “I have compassion on the multitude, because they have stayed with me now three days, and have nothing to eat. <sup class=\"v\">3<\/sup> If I send them away fasting to their home, they will faint on the way, for some of them have come a long way.”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> His disciples answered him, “From where could one satisfy these people with bread here in a deserted place?”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> He asked them, “How many loaves do you have?”"},{"type":"p","html":"They said, “Seven.”"},{"type":"p","html":"<sup class=\"v\">6<\/sup> He commanded the multitude to sit down on the ground, and he took the seven loaves. Having given thanks, he broke them, and gave them to his disciples to serve, and they served the multitude. <sup class=\"v\">7<\/sup> They had a few small fish. Having blessed them, he said to serve these also. <sup class=\"v\">8<\/sup> They ate, and were filled. They took up seven baskets of broken pieces that were left over. <sup class=\"v\">9<\/sup> Those who had eaten were about four thousand. Then he sent them away."},{"type":"p","html":"<sup class=\"v\">10<\/sup> Immediately he entered into the boat with his disciples, and came into the region of Dalmanutha."},{"type":"q","id":"8.1","field":"q60","text":"<b>Head:<\/b> Look at the image that opens this chapter. Again the disciples asked, “Where could one satisfy these people with bread here in a deserted place?” (v. 4). Why do you think they forgot what Jesus did before? What do you forget about God’s past faithfulness?"},{"type":"h2","text":"A Demand for a Sign"},{"type":"p","html":"<sup class=\"v\">11<\/sup> The Pharisees came out and began to question him, seeking from him a sign from heaven, and testing him. <sup class=\"v\">12<\/sup> He sighed deeply in his spirit, and said, “Why does this generation seek a sign? Most certainly I tell you, no sign will be given to this generation.”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> He left them, and again entering into the boat, departed to the other side."},{"type":"q","id":"8.2","field":"q61","text":"<b>Heart:<\/b> The Pharisees wanted a sign from heaven (v. 11). What signs do people ask God for today? Have you ever wanted God to prove himself to you?"},{"type":"h2","text":"The Yeast of the Pharisees"},{"type":"img","src":"img/mark08-v14.jpg","w":1100,"h":626,"alt":"Bread dough with a rolling pin and flour"},{"type":"p","html":"<sup class=\"v\">14<\/sup> They forgot to take bread; and they didn’t have more than one loaf in the boat with them. <sup class=\"v\">15<\/sup> He warned them, saying, “Take heed: beware of the yeast of the Pharisees and the yeast of Herod.”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> They reasoned with one another, saying, “It’s because we have no bread.”"},{"type":"p","html":"<sup class=\"v\">17<\/sup> Jesus, perceiving it, said to them, “Why do you reason that it’s because you have no bread? Don’t you perceive yet, neither understand? Is your heart still hardened? <sup class=\"v\">18<\/sup> Having eyes, don’t you see? Having ears, don’t you hear? Don’t you remember? <sup class=\"v\">19<\/sup> When I broke the five loaves among the five thousand, how many baskets full of broken pieces did you take up?”"},{"type":"p","html":"They told him, “Twelve.”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> “When the seven loaves fed the four thousand, how many baskets full of broken pieces did you take up?”"},{"type":"p","html":"They told him, “Seven.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> He asked them, “Don’t you understand yet?”"},{"type":"q","id":"8.3","field":"q62","text":"<b>Head:<\/b> Consider the image of bread dough. Jesus warned about “the yeast of the Pharisees and the yeast of Herod” (v. 15). What small attitudes can spread through a whole life or community?"},{"type":"q","id":"8.4","field":"q63","text":"<b>Heart:<\/b> Jesus asked, “Don’t you understand yet?” (v. 21). What is something about Jesus you understand now that you did not understand before?"},{"type":"h2","text":"A Blind Man Sees in Stages"},{"type":"img","src":"img/mark08-v22.jpg","w":1100,"h":733,"alt":"Trees blurred as if seen out of focus"},{"type":"p","html":"<sup class=\"v\">22<\/sup> He came to Bethsaida. They brought a blind man to him, and begged him to touch him. <sup class=\"v\">23<\/sup> He took hold of the blind man by the hand, and brought him out of the village. When he had spat on his eyes, and laid his hands on him, he asked him if he saw anything."},{"type":"p","html":"<sup class=\"v\">24<\/sup> He looked up, and said, “I see men; for I see them like trees walking.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> Then again he laid his hands on his eyes. He looked intently, and was restored, and saw everyone clearly. <sup class=\"v\">26<\/sup> He sent him away to his house, saying, “Don’t enter into the village, nor tell anyone in the village.”"},{"type":"q","id":"8.5","field":"q64","text":"<b>Heart:<\/b> Look at the image for this section. At first the man saw “men…like trees walking” (v. 24) before he saw clearly. In what ways is your faith still coming into focus?"},{"type":"h2","text":"“Who Do You Say I Am?”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> Jesus went out, with his disciples, into the villages of Caesarea Philippi. On the way he asked his disciples, “Who do men say that I am?”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> They told him, “John the Baptizer, and others say Elijah, but others: one of the prophets.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> He said to them, “But who do you say that I am?”"},{"type":"p","html":"Peter answered, “You are the Christ.”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> He commanded them that they should tell no one about him."},{"type":"q","id":"8.6","field":"q65","text":"<b>Action:<\/b> Jesus asked, “But who do you say that I am?” (v. 29). Answer this question in your own words. How will your answer shape the way you live this week?"},{"type":"h2","text":"Take Up Your Cross"},{"type":"img","src":"img/mark08-v31.jpg","w":1100,"h":733,"alt":"A wooden cross on a grassy hill"},{"type":"p","html":"<sup class=\"v\">31<\/sup> He began to teach them that the Son of Man must suffer many things, and be rejected by the elders, the chief priests, and the scribes, and be killed, and after three days rise again. <sup class=\"v\">32<\/sup> He spoke to them openly. Peter took him, and began to rebuke him. <sup class=\"v\">33<\/sup> But he, turning around, and seeing his disciples, rebuked Peter, and said, “Get behind me, Satan! For you have in mind not the things of God, but the things of men.”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> He called the multitude to himself with his disciples, and said to them, “Whoever wants to come after me, let him deny himself, and take up his cross, and follow me. <sup class=\"v\">35<\/sup> For whoever wants to save his life will lose it; and whoever will lose his life for my sake and the sake of the Good News will save it. <sup class=\"v\">36<\/sup> For what does it profit a man, to gain the whole world, and forfeit his life? <sup class=\"v\">37<\/sup> For what will a man give in exchange for his life? <sup class=\"v\">38<\/sup> For whoever will be ashamed of me and of my words in this adulterous and sinful generation, the Son of Man also will be ashamed of him, when he comes in his Father’s glory, with the holy angels.”"},{"type":"q","id":"8.7","field":"q66","text":"<b>Action:<\/b> Consider the image of the cross. Jesus said, “Whoever wants to come after me, let him deny himself, and take up his cross, and follow me” (v. 34). What would it mean for you to take up your cross this week?"},{"type":"q","id":"8.8","field":"q67","text":"<b>Head:<\/b> “For what does it profit a man, to gain the whole world, and forfeit his life?” (v. 36). What do people in our culture try to gain? What might they lose in the process?"},{"type":"q","id":"8.9","field":"q68","text":"<b>Heart:<\/b> Which image in this chapter best helps you answer the question, “Who is Jesus?” Explain."}],"prayer":"Father in heaven, you show that Jesus is the Christ, who had to suffer, die and rise again (8:29–31). Give me wisdom as I read, and give me courage to take up my cross and follow him."},{"num":9,"hero":{"src":"img/mark09-hero.jpg","w":1100,"h":734,"alt":"Sunbeams breaking over a dark mountain peak"},"blocks":[{"type":"h2","text":"Jesus Is Transfigured"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He said to them, “Most certainly I tell you, there are some standing here who will in no way taste death until they see God’s Kingdom come with power.”"},{"type":"p","html":"<sup class=\"v\">2<\/sup> After six days Jesus took with him Peter, James, and John, and brought them up onto a high mountain privately by themselves, and he was changed into another form in front of them. <sup class=\"v\">3<\/sup> His clothing became glistening, exceedingly white, like snow, such as no launderer on earth can whiten them. <sup class=\"v\">4<\/sup> Elijah and Moses appeared to them, and they were talking with Jesus."},{"type":"p","html":"<sup class=\"v\">5<\/sup> Peter answered Jesus, “Rabbi, it is good for us to be here. Let’s make three tents: one for you, one for Moses, and one for Elijah.” <sup class=\"v\">6<\/sup> For he didn’t know what to say, for they were very afraid."},{"type":"p","html":"<sup class=\"v\">7<\/sup> A cloud came, overshadowing them, and a voice came out of the cloud, “This is my beloved Son. Listen to him.”"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Suddenly looking around, they saw no one with them any more, except Jesus only."},{"type":"p","html":"<sup class=\"v\">9<\/sup> As they were coming down from the mountain, he commanded them that they should tell no one what things they had seen, until after the Son of Man had risen from the dead. <sup class=\"v\">10<\/sup> They kept this saying to themselves, questioning what the “rising from the dead” meant."},{"type":"p","html":"<sup class=\"v\">11<\/sup> They asked him, saying, “Why do the scribes say that Elijah must come first?”"},{"type":"p","html":"<sup class=\"v\">12<\/sup> He said to them, “Elijah indeed comes first, and restores all things. How is it written about the Son of Man, that he should suffer many things and be despised? <sup class=\"v\">13<\/sup> But I tell you that Elijah has come, and they have also done to him whatever they wanted to, even as it is written about him.”"},{"type":"q","id":"9.1","field":"q69","text":"<b>Heart:<\/b> Look at the image that opens this chapter. On the mountain Jesus’ clothing became “glistening, exceedingly white” (v. 3). Have you ever had a “mountaintop” moment when God seemed especially close? Describe it."},{"type":"q","id":"9.2","field":"q70","text":"<b>Action:<\/b> The voice from the cloud said, “This is my beloved Son. Listen to him” (v. 7). What makes it hard for you to listen to Jesus? What will help you listen to him this week?"},{"type":"h2","text":"A Father’s Plea: “Help My Unbelief!”"},{"type":"img","src":"img/mark09-v14.jpg","w":1100,"h":733,"alt":"A father holding his young son close"},{"type":"p","html":"<sup class=\"v\">14<\/sup> Coming to the disciples, he saw a great multitude around them, and scribes questioning them. <sup class=\"v\">15<\/sup> Immediately all the multitude, when they saw him, were greatly amazed, and running to him, greeted him. <sup class=\"v\">16<\/sup> He asked the scribes, “What are you asking them?”"},{"type":"p","html":"<sup class=\"v\">17<\/sup> One of the multitude answered, “Teacher, I brought to you my son, who has a mute spirit; <sup class=\"v\">18<\/sup> and wherever it seizes him, it throws him down, and he foams at the mouth, and grinds his teeth, and wastes away. I asked your disciples to cast it out, and they weren’t able.”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> He answered him, “Unbelieving generation, how long shall I be with you? How long shall I bear with you? Bring him to me.”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> They brought him to him, and when he saw him, immediately the spirit convulsed him, and he fell on the ground, wallowing and foaming at the mouth."},{"type":"p","html":"<sup class=\"v\">21<\/sup> He asked his father, “How long has it been since this has come to him?”"},{"type":"p","html":"He said, “From childhood. <sup class=\"v\">22<\/sup> Often it has cast him both into the fire and into the water to destroy him. But if you can do anything, have compassion on us, and help us.”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> Jesus said to him, “If you can believe, all things are possible to him who believes.”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> Immediately the father of the child cried out with tears, “I believe. Help my unbelief!”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> When Jesus saw that a multitude came running together, he rebuked the unclean spirit, saying to him, “You mute and deaf spirit, I command you, come out of him, and never enter him again!”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> After crying out and convulsing him greatly, it came out of him. The boy became like one dead, so much that most of them said, “He is dead.” <sup class=\"v\">27<\/sup> But Jesus took him by the hand, and raised him up; and he arose."},{"type":"p","html":"<sup class=\"v\">28<\/sup> When he had come into the house, his disciples asked him privately, “Why couldn’t we cast it out?” <sup class=\"v\">29<\/sup> He said to them, “This kind can come out by nothing, except by prayer and fasting.”"},{"type":"q","id":"9.3","field":"q71","text":"<b>Heart:<\/b> Consider the image of the father and son. The father cried, “I believe. Help my unbelief!” (v. 24). Where do belief and doubt live side by side in your life?"},{"type":"q","id":"9.4","field":"q72","text":"<b>Action:<\/b> Jesus told the disciples, “This kind can come out by nothing, except by prayer and fasting” (v. 29). What situation in your life calls for deeper prayer? When will you set aside time to pray about it?"},{"type":"h2","text":"Jesus Again Speaks of His Death"},{"type":"p","html":"<sup class=\"v\">30<\/sup> They went out from there, and passed through Galilee. He didn’t want anyone to know it. <sup class=\"v\">31<\/sup> For he was teaching his disciples, and said to them, “The Son of Man is being handed over to the hands of men, and they will kill him; and when he is killed, on the third day he will rise again.”"},{"type":"p","html":"<sup class=\"v\">32<\/sup> But they didn’t understand the saying, and were afraid to ask him."},{"type":"h2","text":"Who Is the Greatest?"},{"type":"img","src":"img/mark09-v33.jpg","w":1100,"h":619,"alt":"A laughing little girl in a scarf"},{"type":"p","html":"<sup class=\"v\">33<\/sup> He came to Capernaum, and when he was in the house he asked them, “What were you arguing among yourselves on the way?”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> But they were silent, for they had disputed with one another on the way about who was the greatest."},{"type":"p","html":"<sup class=\"v\">35<\/sup> He sat down, and called the twelve; and he said to them, “If any man wants to be first, he shall be last of all, and servant of all.” <sup class=\"v\">36<\/sup> He took a little child, and set him in the middle of them. Taking him in his arms, he said to them, <sup class=\"v\">37<\/sup> “Whoever receives one such little child in my name, receives me, and whoever receives me, doesn’t receive me, but him who sent me.”"},{"type":"q","id":"9.5","field":"q73","text":"<b>Head:<\/b> Look at the image of the child. The disciples argued about who was greatest (v. 34), and Jesus took a little child in his arms (v. 36). What does true greatness look like in God’s kingdom?"},{"type":"q","id":"9.6","field":"q74","text":"<b>Action:<\/b> “If any man wants to be first, he shall be last of all, and servant of all” (v. 35). Where is God inviting you to serve rather than be first? Name one way you will serve this week."},{"type":"h2","text":"Whoever Is Not Against Us"},{"type":"p","html":"<sup class=\"v\">38<\/sup> John said to him, “Teacher, we saw someone who doesn’t follow us casting out demons in your name; and we forbade him, because he doesn’t follow us.”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> But Jesus said, “Don’t forbid him, for there is no one who will do a mighty work in my name, and be able quickly to speak evil of me. <sup class=\"v\">40<\/sup> For whoever is not against us is on our side. <sup class=\"v\">41<\/sup> For whoever will give you a cup of water to drink in my name, because you are Christ’s, most certainly I tell you, he will in no way lose his reward."},{"type":"q","id":"9.7","field":"q75","text":"<b>Head:<\/b> John wanted to stop someone who was not one of their group (v. 38). Jesus said, “Whoever is not against us is on our side” (v. 40). Why did Jesus correct John? How do you respond to Christians who are different from you?"},{"type":"h2","text":"Salt and Stumbling Blocks"},{"type":"img","src":"img/mark09-v42.jpg","w":1100,"h":619,"alt":"Coarse salt in a spoon"},{"type":"p","html":"<sup class=\"v\">42<\/sup> Whoever will cause one of these little ones who believe in me to stumble, it would be better for him if he were thrown into the sea with a millstone hung around his neck. <sup class=\"v\">43<\/sup> If your hand causes you to stumble, cut it off. It is better for you to enter into life maimed, rather than having your two hands to go into Gehenna, into the unquenchable fire, <sup class=\"v\">44<\/sup> ‘where their worm doesn’t die, and the fire is not quenched.’ <sup class=\"v\">45<\/sup> If your foot causes you to stumble, cut it off. It is better for you to enter into life lame, rather than having your two feet to be cast into Gehenna, into the fire that will never be quenched— <sup class=\"v\">46<\/sup> ‘where their worm doesn’t die, and the fire is not quenched.’ <sup class=\"v\">47<\/sup> If your eye causes you to stumble, cast it out. It is better for you to enter into God’s Kingdom with one eye, rather than having two eyes to be cast into the Gehenna of fire, <sup class=\"v\">48<\/sup> ‘where their worm doesn’t die, and the fire is not quenched.’ <sup class=\"v\">49<\/sup> For everyone will be salted with fire, and every sacrifice will be seasoned with salt. <sup class=\"v\">50<\/sup> Salt is good, but if the salt has lost its saltiness, with what will you season it? Have salt in yourselves, and be at peace with one another.”"},{"type":"q","id":"9.8","field":"q76","text":"<b>Action:<\/b> Consider the image of salt. Jesus said, “Have salt in yourselves, and be at peace with one another” (v. 50). How can your life bring flavor and peace to the people around you this week?"},{"type":"q","id":"9.9","field":"q77","text":"<b>Heart:<\/b> Choose the image in this chapter that you find most challenging. What questions does it raise for you?"}],"prayer":"God, on the mountain you said of Jesus, “This is my beloved Son. Listen to him” (9:7). Give me wisdom as I read, and help me listen to him and trust him when my faith is weak."},{"num":10,"hero":{"src":"img/mark10-hero.jpg","w":1100,"h":734,"alt":"A groom placing a ring on his bride’s finger"},"blocks":[{"type":"h2","text":"Teaching About Marriage"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He arose from there and came into the borders of Judea and beyond the Jordan. Multitudes came together to him again. As he usually did, he was again teaching them. <sup class=\"v\">2<\/sup> Pharisees came to him testing him, and asked him, “Is it lawful for a man to divorce his wife?”"},{"type":"p","html":"<sup class=\"v\">3<\/sup> He answered, “What did Moses command you?”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> They said, “Moses allowed a certificate of divorce to be written, and to divorce her.”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> But Jesus said to them, “For your hardness of heart, he wrote you this commandment. <sup class=\"v\">6<\/sup> But from the beginning of the creation, God made them male and female. <sup class=\"v\">7<\/sup> For this cause a man will leave his father and mother, and will join to his wife, <sup class=\"v\">8<\/sup> and the two will become one flesh, so that they are no longer two, but one flesh. <sup class=\"v\">9<\/sup> What therefore God has joined together, let no man separate.”"},{"type":"p","html":"<sup class=\"v\">10<\/sup> In the house, his disciples asked him again about the same matter. <sup class=\"v\">11<\/sup> He said to them, “Whoever divorces his wife, and marries another, commits adultery against her. <sup class=\"v\">12<\/sup> If a woman herself divorces her husband, and marries another, she commits adultery.”"},{"type":"q","id":"10.1","field":"q78","text":"<b>Head:<\/b> Look at the image that opens this chapter. Jesus pointed back to God’s design at the beginning: “the two will become one flesh” (v. 8). Why do you think Jesus went back to creation? What do the marriages and close relationships around you teach you about faithfulness?"},{"type":"h2","text":"Jesus Welcomes the Children"},{"type":"img","src":"img/mark10-v13.jpg","w":1100,"h":736,"alt":"A little girl running across the grass"},{"type":"p","html":"<sup class=\"v\">13<\/sup> They were bringing to him little children, that he should touch them, but the disciples rebuked those who were bringing them. <sup class=\"v\">14<\/sup> But when Jesus saw it, he was moved with indignation, and said to them, “Allow the little children to come to me! Don’t forbid them, for God’s Kingdom belongs to such as these. <sup class=\"v\">15<\/sup> Most certainly I tell you, whoever will not receive God’s Kingdom like a little child, he will in no way enter into it.” <sup class=\"v\">16<\/sup> He took them in his arms, and blessed them, laying his hands on them."},{"type":"q","id":"10.2","field":"q79","text":"<b>Head:<\/b> Consider the image of the children. Jesus was indignant when the disciples turned children away and said, “Allow the little children to come to me!” (v. 14). What does it mean to receive God’s kingdom “like a little child” (v. 15)?"},{"type":"h2","text":"The Rich Man"},{"type":"img","src":"img/mark10-v17.jpg","w":1100,"h":577,"alt":"A pile of gold coins"},{"type":"p","html":"<sup class=\"v\">17<\/sup> As he was going out into the way, one ran to him, knelt before him, and asked him, “Good Teacher, what shall I do that I may inherit eternal life?”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Jesus said to him, “Why do you call me good? No one is good except one—God. <sup class=\"v\">19<\/sup> You know the commandments: ‘Do not murder,’ ‘Do not commit adultery,’ ‘Do not steal,’ ‘Do not give false testimony,’ ‘Do not defraud,’ ‘Honor your father and mother.’ ”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> He said to him, “Teacher, I have observed all these things from my youth.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> Jesus looking at him loved him, and said to him, “One thing you lack. Go, sell whatever you have, and give to the poor, and you will have treasure in heaven; and come, follow me, taking up the cross.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> But his face fell at that saying, and he went away sorrowful, for he was one who had great possessions. <sup class=\"v\">23<\/sup> Jesus looked around, and said to his disciples, “How difficult it is for those who have riches to enter into God’s Kingdom!”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> The disciples were amazed at his words. But Jesus answered again, “Children, how hard it is for those who trust in riches to enter into God’s Kingdom! <sup class=\"v\">25<\/sup> It is easier for a camel to go through a needle’s eye than for a rich man to enter into God’s Kingdom.”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> They were exceedingly astonished, saying to him, “Then who can be saved?”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> Jesus, looking at them, said, “With men it is impossible, but not with God, for all things are possible with God.”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> Peter began to tell him, “Behold, we have left all, and have followed you.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> Jesus said, “Most certainly I tell you, there is no one who has left house, or brothers, or sisters, or father, or mother, or wife, or children, or land, for my sake, and for the sake of the Good News, <sup class=\"v\">30<\/sup> but he will receive one hundred times more now in this time: houses, brothers, sisters, mothers, children, and land, with persecutions; and in the age to come eternal life. <sup class=\"v\">31<\/sup> But many who are first will be last; and the last first.”"},{"type":"q","id":"10.3","field":"q80","text":"<b>Heart:<\/b> Look at the image for this section. Jesus looked at the rich man and “loved him” (v. 21), then asked him to give up what held him back. What would be hardest for you to give up to follow Jesus?"},{"type":"q","id":"10.4","field":"q81","text":"<b>Head:<\/b> “It is easier for a camel to go through a needle’s eye than for a rich man to enter into God’s Kingdom” (v. 25). Why do riches make following Jesus so difficult?"},{"type":"h2","text":"Jesus Predicts His Death a Third Time"},{"type":"p","html":"<sup class=\"v\">32<\/sup> They were on the way, going up to Jerusalem; and Jesus was going in front of them, and they were amazed; and those who followed were afraid. He again took the twelve, and began to tell them the things that were going to happen to him. <sup class=\"v\">33<\/sup> “Behold, we are going up to Jerusalem. The Son of Man will be delivered to the chief priests and the scribes. They will condemn him to death, and will deliver him to the Gentiles. <sup class=\"v\">34<\/sup> They will mock him, spit on him, scourge him, and kill him. On the third day he will rise again.”"},{"type":"q","id":"10.5","field":"q82","text":"<b>Heart:<\/b> Jesus walked ahead toward Jerusalem while his followers were amazed and afraid (v. 32). How do you respond when following Jesus leads you somewhere you would not choose?"},{"type":"h2","text":"The Request of James and John"},{"type":"p","html":"<sup class=\"v\">35<\/sup> James and John, the sons of Zebedee, came near to him, saying, “Teacher, we want you to do for us whatever we will ask.”"},{"type":"p","html":"<sup class=\"v\">36<\/sup> He said to them, “What do you want me to do for you?”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> They said to him, “Grant to us that we may sit, one at your right hand, and one at your left hand, in your glory.”"},{"type":"p","html":"<sup class=\"v\">38<\/sup> But Jesus said to them, “You don’t know what you are asking. Are you able to drink the cup that I drink, and to be baptized with the baptism that I am baptized with?”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> They said to him, “We are able.”"},{"type":"p","html":"Jesus said to them, “You shall indeed drink the cup that I drink, and you shall be baptized with the baptism that I am baptized with; <sup class=\"v\">40<\/sup> but to sit at my right hand and at my left hand is not mine to give, but for whom it has been prepared.”"},{"type":"p","html":"<sup class=\"v\">41<\/sup> When the ten heard it, they began to be indignant toward James and John."},{"type":"p","html":"<sup class=\"v\">42<\/sup> Jesus summoned them, and said to them, “You know that they who are recognized as rulers over the nations lord it over them, and their great ones exercise authority over them. <sup class=\"v\">43<\/sup> But it shall not be so among you, but whoever wants to become great among you shall be your servant. <sup class=\"v\">44<\/sup> Whoever of you wants to become first among you, shall be bondservant of all. <sup class=\"v\">45<\/sup> For the Son of Man also came not to be served, but to serve, and to give his life as a ransom for many.”"},{"type":"q","id":"10.6","field":"q83","text":"<b>Action:<\/b> James and John asked for the best seats in glory (v. 37). Jesus said he “came not to be served, but to serve, and to give his life as a ransom for many” (v. 45). How could you use your position or influence to serve someone this week?"},{"type":"h2","text":"Blind Bartimaeus Receives His Sight"},{"type":"img","src":"img/mark10-v46.jpg","w":1100,"h":914,"alt":"An old man sitting by a stone wall beside his donkey"},{"type":"p","html":"<sup class=\"v\">46<\/sup> They came to Jericho. As he went out from Jericho, with his disciples and a great multitude, the son of Timaeus, Bartimaeus, a blind beggar, was sitting by the road. <sup class=\"v\">47<\/sup> When he heard that it was Jesus the Nazarene, he began to cry out, and say, “Jesus, you son of David, have mercy on me!” <sup class=\"v\">48<\/sup> Many rebuked him, that he should be quiet, but he cried out much more, “You son of David, have mercy on me!”"},{"type":"p","html":"<sup class=\"v\">49<\/sup> Jesus stood still, and said, “Call him.”"},{"type":"p","html":"They called the blind man, saying to him, “Cheer up! Get up. He is calling you!”"},{"type":"p","html":"<sup class=\"v\">50<\/sup> He, casting away his cloak, sprang up, and came to Jesus."},{"type":"p","html":"<sup class=\"v\">51<\/sup> Jesus asked him, “What do you want me to do for you?”"},{"type":"p","html":"The blind man said to him, “Rabboni, that I may see again.”"},{"type":"p","html":"<sup class=\"v\">52<\/sup> Jesus said to him, “Go your way. Your faith has made you well.” Immediately he received his sight, and followed Jesus on the way."},{"type":"q","id":"10.7","field":"q84","text":"<b>Heart:<\/b> Consider the image of the person by the road. Many told Bartimaeus to be quiet, “but he cried out much more” (v. 48). What keeps you from crying out to Jesus?"},{"type":"q","id":"10.8","field":"q85","text":"<b>Action:<\/b> Jesus asked, “What do you want me to do for you?” (v. 51). If Jesus asked you that question today, what would you say? Bring that request to him in prayer this week."},{"type":"q","id":"10.9","field":"q86","text":"<b>Heart:<\/b> Which image in this chapter do you most identify with right now? Why?"}],"prayer":"Father in heaven, your Son came “not to be served, but to serve” (10:45). Give me wisdom as I read, and make me a servant to the people around me."},{"num":11,"hero":{"src":"img/mark11-hero.jpg","w":1100,"h":734,"alt":"Palm branches against a blue sky"},"blocks":[{"type":"h2","text":"Jesus Enters Jerusalem"},{"type":"img","src":"img/mark11-v01.jpg","w":1100,"h":733,"alt":"A young donkey resting in a field"},{"type":"p","html":"<sup class=\"v\">1<\/sup> When they came near to Jerusalem, to Bethsphage and Bethany, at the Mount of Olives, he sent two of his disciples, <sup class=\"v\">2<\/sup> and said to them, “Go your way into the village that is opposite you. Immediately as you enter into it, you will find a young donkey tied, on which no one has sat. Untie him, and bring him. <sup class=\"v\">3<\/sup> If anyone asks you, ‘Why are you doing this?’ say, ‘The Lord needs him;’ and immediately he will send him back here.”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> They went away, and found a young donkey tied at the door outside in the open street, and they untied him. <sup class=\"v\">5<\/sup> Some of those who stood there asked them, “What are you doing, untying the young donkey?” <sup class=\"v\">6<\/sup> They said to them just as Jesus had said, and they let them go."},{"type":"p","html":"<sup class=\"v\">7<\/sup> They brought the young donkey to Jesus, and threw their garments on it, and Jesus sat on it. <sup class=\"v\">8<\/sup> Many spread their garments on the way, and others were cutting down branches from the trees, and spreading them on the road. <sup class=\"v\">9<\/sup> Those who went in front, and those who followed, cried out, “Hosanna! Blessed is he who comes in the name of the Lord! <sup class=\"v\">10<\/sup> Blessed is the kingdom of our father David that is coming in the name of the Lord! Hosanna in the highest!”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> Jesus entered into the temple in Jerusalem. When he had looked around at everything, it being now evening, he went out to Bethany with the twelve."},{"type":"q","id":"11.1","field":"q87","text":"<b>Action:<\/b> Look at the image that opens this chapter. The crowd shouted, “Hosanna! Blessed is he who comes in the name of the Lord!” (v. 9). What would it look like for you to welcome Jesus into your home and your heart today?"},{"type":"q","id":"11.2","field":"q88","text":"<b>Head:<\/b> Consider the image of the donkey. Jesus chose a humble young donkey rather than a war horse. What does this say about the kind of King he is?"},{"type":"h2","text":"A Fig Tree Without Fruit"},{"type":"img","src":"img/mark11-v12.jpg","w":1100,"h":733,"alt":"Fig tree branches full of leaves"},{"type":"p","html":"<sup class=\"v\">12<\/sup> The next day, when they had come out from Bethany, he was hungry. <sup class=\"v\">13<\/sup> Seeing a fig tree afar off having leaves, he came to see if perhaps he might find anything on it. When he came to it, he found nothing but leaves, for it was not the season for figs. <sup class=\"v\">14<\/sup> Jesus told it, “May no one ever eat fruit from you again!” and his disciples heard it."},{"type":"q","id":"11.3","field":"q89","text":"<b>Heart:<\/b> Look at the image of the fig tree. The tree had leaves but no fruit (v. 13). Where might your life look full on the outside but lack real fruit?"},{"type":"h2","text":"Jesus Clears the Temple"},{"type":"p","html":"<sup class=\"v\">15<\/sup> They came to Jerusalem, and Jesus entered into the temple, and began to throw out those who sold and those who bought in the temple, and overthrew the money changers’ tables, and the seats of those who sold the doves. <sup class=\"v\">16<\/sup> He would not allow anyone to carry a container through the temple. <sup class=\"v\">17<\/sup> He taught, saying to them, “Isn’t it written, ‘My house will be called a house of prayer for all the nations?’ But you have made it a den of robbers!”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> The chief priests and the scribes heard it, and sought how they might destroy him. For they feared him, because all the multitude was astonished at his teaching."},{"type":"p","html":"<sup class=\"v\">19<\/sup> When evening came, he went out of the city."},{"type":"q","id":"11.4","field":"q90","text":"<b>Head:<\/b> Jesus said, “My house will be called a house of prayer for all the nations” (v. 17). What gets in the way of prayer in our churches and in our lives?"},{"type":"h2","text":"Faith That Moves Mountains"},{"type":"img","src":"img/mark11-v20.jpg","w":1100,"h":797,"alt":"A mountain reflected in a still lake"},{"type":"p","html":"<sup class=\"v\">20<\/sup> As they passed by in the morning, they saw the fig tree withered away from the roots. <sup class=\"v\">21<\/sup> Peter, remembering, said to him, “Rabbi, look! The fig tree which you cursed has withered away.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> Jesus answered them, “Have faith in God. <sup class=\"v\">23<\/sup> For most certainly I tell you, whoever may tell this mountain, ‘Be taken up and cast into the sea,’ and doesn’t doubt in his heart, but believes that what he says is happening; he shall have whatever he says. <sup class=\"v\">24<\/sup> Therefore I tell you, all things whatever you pray and ask for, believe that you have received them, and you shall have them. <sup class=\"v\">25<\/sup> Whenever you stand praying, forgive, if you have anything against anyone; so that your Father, who is in heaven, may also forgive you your transgressions. <sup class=\"v\">26<\/sup> But if you do not forgive, neither will your Father in heaven forgive your transgressions.”"},{"type":"q","id":"11.5","field":"q91","text":"<b>Heart:<\/b> Consider the image of the mountain. Jesus said, “Have faith in God” (v. 22) and spoke of faith that could move a mountain (v. 23). What mountain in your life needs faith?"},{"type":"q","id":"11.6","field":"q92","text":"<b>Action:<\/b> Jesus connected prayer with forgiveness: “forgive, if you have anything against anyone” (v. 25). Is there someone you need to forgive before you pray? What step toward forgiveness will you take?"},{"type":"h2","text":"By What Authority?"},{"type":"p","html":"<sup class=\"v\">27<\/sup> They came again to Jerusalem, and as he was walking in the temple, the chief priests, the scribes, and the elders came to him, <sup class=\"v\">28<\/sup> and they began saying to him, “By what authority do you do these things? Or who gave you this authority to do these things?”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> Jesus said to them, “I will ask you one question. Answer me, and I will tell you by what authority I do these things. <sup class=\"v\">30<\/sup> The baptism of John—was it from heaven, or from men? Answer me.”"},{"type":"p","html":"<sup class=\"v\">31<\/sup> They reasoned with themselves, saying, “If we should say, ‘From heaven;’ he will say, ‘Why then did you not believe him?’ <sup class=\"v\">32<\/sup> If we should say, ‘From men’ ”—they feared the people, for all held John to really be a prophet. <sup class=\"v\">33<\/sup> They answered Jesus, “We don’t know.”"},{"type":"q","id":"11.7","field":"q93","text":"<b>Head:<\/b> The leaders asked, “By what authority do you do these things?” (v. 28). Who or what has authority in your life? How do you decide whom to trust?"},{"type":"q","id":"11.8","field":"q94","text":"<b>Heart:<\/b> Choose an image from this chapter and tell the story you see in it. How might that story connect with Jesus’ entry into Jerusalem?"},{"type":"p","html":"Jesus said to them, “Neither do I tell you by what authority I do these things.”"}],"prayer":"God, you want your house to be “a house of prayer for all the nations” (11:17). Give me wisdom as I read, and teach me to pray with faith and to forgive."},{"num":12,"hero":{"src":"img/mark12-hero.jpg","w":1100,"h":733,"alt":"Rows of grapevines in a vineyard"},"blocks":[{"type":"h2","text":"The Tenants of the Vineyard"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He began to speak to them in parables. “A man planted a vineyard, put a hedge around it, dug a pit for the wine press, built a tower, rented it out to a farmer, and went into another country. <sup class=\"v\">2<\/sup> When it was time, he sent a servant to the farmer to get from the farmer his share of the fruit of the vineyard. <sup class=\"v\">3<\/sup> They took him, beat him, and sent him away empty. <sup class=\"v\">4<\/sup> Again, he sent another servant to them; and they threw stones at him, wounded him in the head, and sent him away shamefully treated. <sup class=\"v\">5<\/sup> Again he sent another; and they killed him; and many others, beating some, and killing some. <sup class=\"v\">6<\/sup> Therefore still having one, his beloved son, he sent him last to them, saying, ‘They will respect my son.’ <sup class=\"v\">7<\/sup> But those farmers said among themselves, ‘This is the heir. Come, let’s kill him, and the inheritance will be ours.’ <sup class=\"v\">8<\/sup> They took him, killed him, and cast him out of the vineyard. <sup class=\"v\">9<\/sup> What therefore will the lord of the vineyard do? He will come and destroy the farmers, and will give the vineyard to others. <sup class=\"v\">10<\/sup> Haven’t you even read this Scripture:"},{"type":"poem","lines":["‘The stone which the builders rejected","was made the head of the corner.","<sup class=\"v\">11<\/sup> This was from the Lord.","It is marvelous in our eyes’?”"]},{"type":"p","html":"<sup class=\"v\">12<\/sup> They tried to seize him, but they feared the multitude; for they perceived that he spoke the parable against them. They left him, and went away."},{"type":"q","id":"12.1","field":"q95","text":"<b>Action:<\/b> Look at the image that opens this chapter. The owner planted a vineyard and trusted it to tenants who refused to give him its fruit (v. 1-3). What has God entrusted to you? How will you care for it this week?"},{"type":"q","id":"12.2","field":"q96","text":"<b>Heart:<\/b> “The stone which the builders rejected was made the head of the corner” (v. 10). When has something or someone rejected by others turned out to be precious?"},{"type":"h2","text":"Taxes to Caesar"},{"type":"img","src":"img/mark12-v13.jpg","w":1100,"h":825,"alt":"Old silver coins stamped with faces"},{"type":"p","html":"<sup class=\"v\">13<\/sup> They sent some of the Pharisees and the Herodians to him, that they might trap him with words. <sup class=\"v\">14<\/sup> When they had come, they asked him, “Teacher, we know that you are honest, and don’t defer to anyone; for you aren’t partial to anyone, but truly teach the way of God. Is it lawful to pay taxes to Caesar, or not? <sup class=\"v\">15<\/sup> Shall we give, or shall we not give?”"},{"type":"p","html":"But he, knowing their hypocrisy, said to them, “Why do you test me? Bring me a denarius, that I may see it.”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> They brought it."},{"type":"p","html":"He said to them, “Whose is this image and inscription?”"},{"type":"p","html":"They said to him, “Caesar’s.”"},{"type":"p","html":"<sup class=\"v\">17<\/sup> Jesus answered them, “Render to Caesar the things that are Caesar’s, and to God the things that are God’s.”"},{"type":"q","id":"12.3","field":"q97","text":"<b>Head:<\/b> Consider the image of the coins. Jesus said, “Render to Caesar the things that are Caesar’s, and to God the things that are God’s” (v. 17). If you bear God’s image, what does it mean to give yourself to God?"},{"type":"p","html":"They marveled greatly at him."},{"type":"h2","text":"A Question About the Resurrection"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Some Sadducees, who say that there is no resurrection, came to him. They asked him, saying, <sup class=\"v\">19<\/sup> “Teacher, Moses wrote to us, ‘If a man’s brother dies, and leaves a wife behind him, and leaves no children, that his brother should take his wife, and raise up offspring for his brother.’ <sup class=\"v\">20<\/sup> There were seven brothers. The first took a wife, and dying left no offspring. <sup class=\"v\">21<\/sup> The second took her, and died, leaving no children behind him. The third likewise; <sup class=\"v\">22<\/sup> and the seven took her and left no children. Last of all the woman also died. <sup class=\"v\">23<\/sup> In the resurrection, when they rise, whose wife will she be of them? For the seven had her as a wife.”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> Jesus answered them, “Isn’t this because you are mistaken, not knowing the Scriptures, nor the power of God? <sup class=\"v\">25<\/sup> For when they will rise from the dead, they neither marry, nor are given in marriage, but are like angels in heaven. <sup class=\"v\">26<\/sup> But about the dead, that they are raised; haven’t you read in the book of Moses, about the Bush, how God spoke to him, saying, ‘I am the God of Abraham, the God of Isaac, and the God of Jacob’? <sup class=\"v\">27<\/sup> He is not the God of the dead, but of the living. You are therefore badly mistaken.”"},{"type":"q","id":"12.4","field":"q98","text":"<b>Heart:<\/b> Jesus said, “He is not the God of the dead, but of the living” (v. 27). How does belief in the resurrection shape the way you face death and loss?"},{"type":"h2","text":"The Greatest Commandment"},{"type":"img","src":"img/mark12-v28.jpg","w":1100,"h":688,"alt":"Hands holding a red heart"},{"type":"p","html":"<sup class=\"v\">28<\/sup> One of the scribes came, and heard them questioning together, and knowing that he had answered them well, asked him, “Which commandment is the greatest of all?”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> Jesus answered, “The greatest is, ‘Hear, Israel, the Lord our God, the Lord is one: <sup class=\"v\">30<\/sup> you shall love the Lord your God with all your heart, and with all your soul, and with all your mind, and with all your strength.’ This is the first commandment. <sup class=\"v\">31<\/sup> The second is like this, ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these.”"},{"type":"p","html":"<sup class=\"v\">32<\/sup> The scribe said to him, “Truly, teacher, you have said well that he is one, and there is none other but he, <sup class=\"v\">33<\/sup> and to love him with all the heart, and with all the understanding, with all the soul, and with all the strength, and to love his neighbor as himself, is more important than all whole burnt offerings and sacrifices.”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> When Jesus saw that he answered wisely, he said to him, “You are not far from God’s Kingdom.”"},{"type":"q","id":"12.5","field":"q99","text":"<b>Action:<\/b> Look at the image for this section. Jesus named the greatest commandments: love God with all your heart, soul, mind and strength, and love your neighbor as yourself (v. 30-31). Which of these is hardest for you right now? What is one way you will love God or your neighbor this week?"},{"type":"q","id":"12.6","field":"q100","text":"<b>Head:<\/b> Jesus told the scribe, “You are not far from God’s Kingdom” (v. 34). What do you think was still missing for him? What might be missing for you?"},{"type":"p","html":"No one dared ask him any question after that."},{"type":"h2","text":"Whose Son Is the Christ?"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Jesus responded, as he taught in the temple, “How is it that the scribes say that the Christ is the son of David? <sup class=\"v\">36<\/sup> For David himself said in the Holy Spirit,"},{"type":"poem","lines":["‘The Lord said to my Lord,","“Sit at my right hand,","until I make your enemies the footstool of your feet.” ’"]},{"type":"p","html":"<sup class=\"v\">37<\/sup> Therefore David himself calls him Lord, so how can he be his son?”"},{"type":"p","html":"The common people heard him gladly."},{"type":"h2","text":"Warning About the Scribes"},{"type":"p","html":"<sup class=\"v\">38<\/sup> In his teaching he said to them, “Beware of the scribes, who like to walk in long robes, and to get greetings in the marketplaces, <sup class=\"v\">39<\/sup> and the best seats in the synagogues, and the best places at feasts: <sup class=\"v\">40<\/sup> those who devour widows’ houses, and for a pretense make long prayers. These will receive greater condemnation.”"},{"type":"q","id":"12.7","field":"q101","text":"<b>Action:<\/b> Jesus warned against those who love greetings, the best seats and long prayers for show (v. 38-40). How will you guard against doing good things to be seen?"},{"type":"h2","text":"The Widow’s Gift"},{"type":"img","src":"img/mark12-v41.jpg","w":1100,"h":733,"alt":"A hand holding a few small coins"},{"type":"p","html":"<sup class=\"v\">41<\/sup> Jesus sat down opposite the treasury, and saw how the multitude cast money into the treasury. Many who were rich cast in much. <sup class=\"v\">42<\/sup> A poor widow came, and she cast in two small brass coins, which equal a quadrans coin. <sup class=\"v\">43<\/sup> He called his disciples to himself, and said to them, “Most certainly I tell you, this poor widow gave more than all those who are giving into the treasury, <sup class=\"v\">44<\/sup> for they all gave out of their abundance, but she, out of her poverty, gave all that she had to live on.”"},{"type":"q","id":"12.8","field":"q102","text":"<b>Head:<\/b> Consider the image of the two small coins. The widow gave “all that she had to live on” (v. 44). What does her gift teach you about generosity and trust?"},{"type":"q","id":"12.9","field":"q103","text":"<b>Heart:<\/b> Which image in this chapter best captures what it means to give your whole self to God? Explain."}],"prayer":"Father in heaven, you are the God of the living, and you are worthy of all my heart, soul, mind and strength (12:27, 30). Give me wisdom as I read, and help me love you and my neighbor with all I have."},{"num":13,"hero":{"src":"img/mark13-hero.jpg","w":1100,"h":734,"alt":"Ruins of an ancient stone temple"},"blocks":[{"type":"h2","text":"Signs of the End"},{"type":"p","html":"<sup class=\"v\">1<\/sup> As he went out of the temple, one of his disciples said to him, “Teacher, see what kind of stones and what kind of buildings!”"},{"type":"p","html":"<sup class=\"v\">2<\/sup> Jesus said to him, “Do you see these great buildings? There will not be left here one stone on another, which will not be thrown down.”"},{"type":"p","html":"<sup class=\"v\">3<\/sup> As he sat on the Mount of Olives opposite the temple, Peter, James, John, and Andrew asked him privately, <sup class=\"v\">4<\/sup> “Tell us, when will these things be? What is the sign that these things are all about to be fulfilled?”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> Jesus, answering, began to tell them, “Be careful that no one leads you astray. <sup class=\"v\">6<\/sup> For many will come in my name, saying, ‘I am he!’ and will lead many astray."},{"type":"p","html":"<sup class=\"v\">7<\/sup> “When you hear of wars and rumors of wars, don’t be troubled. For those must happen, but the end is not yet. <sup class=\"v\">8<\/sup> For nation will rise against nation, and kingdom against kingdom. There will be earthquakes in various places. There will be famines and troubles. These things are the beginning of birth pains. <sup class=\"v\">9<\/sup> But watch yourselves, for they will deliver you up to councils. You will be beaten in synagogues. You will stand before rulers and kings for my sake, for a testimony to them. <sup class=\"v\">10<\/sup> The Good News must first be preached to all the nations. <sup class=\"v\">11<\/sup> When they lead you away and deliver you up, don’t be anxious beforehand, or premeditate what you will say, but say whatever will be given you in that hour. For it is not you who speak, but the Holy Spirit."},{"type":"p","html":"<sup class=\"v\">12<\/sup> “Brother will deliver up brother to death, and the father his child. Children will rise up against parents, and cause them to be put to death. <sup class=\"v\">13<\/sup> You will be hated by all men for my name’s sake, but he who endures to the end will be saved."},{"type":"q","id":"13.1","field":"q104","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Jesus said of the temple’s great stones, “There will not be left here one stone on another” (v. 2). What things that seem permanent in your life could one day pass away?"},{"type":"q","id":"13.2","field":"q105","text":"<b>Head:<\/b> Jesus said, “Be careful that no one leads you astray” (v. 5). What voices today might lead people away from Jesus? How can you recognize them?"},{"type":"q","id":"13.3","field":"q106","text":"<b>Action:<\/b> “He who endures to the end will be saved” (v. 13). What helps you keep going in faith when life becomes hard? What will you do this week to strengthen your endurance?"},{"type":"h2","text":"Days of Distress"},{"type":"img","src":"img/mark13-v14.jpg","w":1100,"h":619,"alt":"Lightning in dark storm clouds"},{"type":"p","html":"<sup class=\"v\">14<\/sup> But when you see the abomination of desolation, spoken of by Daniel the prophet, standing where it ought not” (let the reader understand), “then let those who are in Judea flee to the mountains, <sup class=\"v\">15<\/sup> and let him who is on the housetop not go down, nor enter in, to take anything out of his house. <sup class=\"v\">16<\/sup> Let him who is in the field not return back to take his cloak. <sup class=\"v\">17<\/sup> But woe to those who are with child and to those who nurse babies in those days! <sup class=\"v\">18<\/sup> Pray that your flight won’t be in the winter. <sup class=\"v\">19<\/sup> For in those days there will be oppression, such as there has not been the like from the beginning of the creation which God created until now, and never will be. <sup class=\"v\">20<\/sup> Unless the Lord had shortened the days, no flesh would have been saved; but for the sake of the chosen ones, whom he picked out, he shortened the days. <sup class=\"v\">21<\/sup> Then if anyone tells you, ‘Look, here is the Christ!’ or, ‘Look, there!’ don’t believe it. <sup class=\"v\">22<\/sup> For there will arise false christs and false prophets, and will show signs and wonders, that they may lead astray, if possible, even the chosen ones. <sup class=\"v\">23<\/sup> But you watch."},{"type":"q","id":"13.4","field":"q107","text":"<b>Heart:<\/b> Consider the image of the storm. Jesus spoke of great distress, yet he said, “I have told you all things beforehand” (v. 23). How does it help to know that nothing surprises God?"},{"type":"p","html":"“Behold, I have told you all things beforehand."},{"type":"h2","text":"The Coming of the Son of Man"},{"type":"img","src":"img/mark13-v24.jpg","w":1100,"h":733,"alt":"Fresh new leaves budding on a fig branch"},{"type":"p","html":"<sup class=\"v\">24<\/sup> But in those days, after that oppression, the sun will be darkened, the moon will not give its light, <sup class=\"v\">25<\/sup> the stars will be falling from the sky, and the powers that are in the heavens will be shaken. <sup class=\"v\">26<\/sup> Then they will see the Son of Man coming in clouds with great power and glory. <sup class=\"v\">27<\/sup> Then he will send out his angels, and will gather together his chosen ones from the four winds, from the ends of the earth to the ends of the sky."},{"type":"p","html":"<sup class=\"v\">28<\/sup> “Now from the fig tree, learn this parable. When the branch has now become tender, and produces its leaves, you know that the summer is near; <sup class=\"v\">29<\/sup> even so you also, when you see these things coming to pass, know that it is near, at the doors. <sup class=\"v\">30<\/sup> Most certainly I say to you, this generation will not pass away until all these things happen. <sup class=\"v\">31<\/sup> Heaven and earth will pass away, but my words will not pass away."},{"type":"q","id":"13.5","field":"q108","text":"<b>Action:<\/b> Look at the image of the budding tree. Jesus said, “Heaven and earth will pass away, but my words will not pass away” (v. 31). Which words of Jesus are an anchor for you? Write one down and keep it with you this week."},{"type":"h2","text":"Stay Awake"},{"type":"img","src":"img/mark13-v32.jpg","w":1100,"h":733,"alt":"A man carrying a lantern through the dark"},{"type":"p","html":"<sup class=\"v\">32<\/sup> But of that day or that hour no one knows, not even the angels in heaven, nor the Son, but only the Father. <sup class=\"v\">33<\/sup> Watch, keep alert, and pray; for you don’t know when the time is."},{"type":"p","html":"<sup class=\"v\">34<\/sup> “It is like a man, traveling to another country, having left his house, and given authority to his servants, and to each one his work, and also commanded the doorkeeper to keep watch. <sup class=\"v\">35<\/sup> Watch therefore, for you don’t know when the lord of the house is coming, whether at evening, or at midnight, or when the rooster crows, or in the morning; <sup class=\"v\">36<\/sup> lest coming suddenly he might find you sleeping. <sup class=\"v\">37<\/sup> What I tell you, I tell all: Watch.”"},{"type":"q","id":"13.6","field":"q109","text":"<b>Action:<\/b> Consider the image of the person keeping watch. Jesus said, “What I tell you, I tell all: Watch!” (v. 37). What does it look like to stay awake spiritually in daily life? What will that look like for you this week?"},{"type":"q","id":"13.7","field":"q110","text":"<b>Head:<\/b> In Jesus’ day there were only a few images. Today we see thousands of images that shape how we picture the future. How do the images in this chapter compare with the pictures of the future you see in the media?"}],"prayer":"God, your words will not pass away, even when heaven and earth pass away (13:31). Give me wisdom as I read, and help me stay alert and ready for the return of your Son."},{"num":14,"hero":{"src":"img/mark14-hero.jpg","w":1100,"h":823,"alt":"A carved alabaster jar"},"blocks":[{"type":"h2","text":"The Plot to Kill Jesus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> It was now two days before the feast of the Passover and the unleavened bread, and the chief priests and the scribes sought how they might seize him by deception, and kill him. <sup class=\"v\">2<\/sup> For they said, “Not during the feast, because there might be a riot among the people.”"},{"type":"h2","text":"Jesus Anointed at Bethany"},{"type":"p","html":"<sup class=\"v\">3<\/sup> While he was at Bethany, in the house of Simon the leper, as he sat at the table, a woman came having an alabaster jar of ointment of pure nard—very costly. She broke the jar, and poured it over his head. <sup class=\"v\">4<\/sup> But there were some who were indignant among themselves, saying, “Why has this ointment been wasted? <sup class=\"v\">5<\/sup> For this might have been sold for more than three hundred denarii, and given to the poor.” So they grumbled against her."},{"type":"p","html":"<sup class=\"v\">6<\/sup> But Jesus said, “Leave her alone. Why do you trouble her? She has done a good work for me. <sup class=\"v\">7<\/sup> For you always have the poor with you, and whenever you want to, you can do them good; but you will not always have me. <sup class=\"v\">8<\/sup> She has done what she could. She has anointed my body beforehand for the burying. <sup class=\"v\">9<\/sup> Most certainly I tell you, wherever this Good News may be preached throughout the whole world, that which this woman has done will also be spoken of for a memorial of her.”"},{"type":"q","id":"14.1","field":"q111","text":"<b>Action:<\/b> Look at the image that opens this chapter. The woman broke an expensive jar of ointment and poured it on Jesus (v. 3). Some called it waste; Jesus called it “a good work” (v. 6). What would a costly act of love for Jesus look like in your life this week?"},{"type":"h2","text":"Judas Agrees to Betray Jesus"},{"type":"p","html":"<sup class=\"v\">10<\/sup> Judas Iscariot, who was one of the twelve, went away to the chief priests, that he might deliver him to them. <sup class=\"v\">11<\/sup> They, when they heard it, were glad, and promised to give him money. He sought how he might conveniently deliver him."},{"type":"q","id":"14.2","field":"q112","text":"<b>Head:<\/b> Judas went to the chief priests, and they promised to give him money (v. 10-11). What do you think led Judas to betray Jesus? What could lead someone to betray a friend today?"},{"type":"h2","text":"The Passover Meal"},{"type":"p","html":"<sup class=\"v\">12<\/sup> On the first day of unleavened bread, when they sacrificed the Passover, his disciples asked him, “Where do you want us to go and prepare that you may eat the Passover?”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> He sent two of his disciples, and said to them, “Go into the city, and there you will meet a man carrying a pitcher of water. Follow him, <sup class=\"v\">14<\/sup> and wherever he enters in, tell the master of the house, ‘The Teacher says, “Where is the guest room, where I may eat the Passover with my disciples?” ’ <sup class=\"v\">15<\/sup> He will himself show you a large upper room furnished and ready. Get ready for us there.”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> His disciples went out, and came into the city, and found things as he had said to them, and they prepared the Passover."},{"type":"p","html":"<sup class=\"v\">17<\/sup> When it was evening he came with the twelve. <sup class=\"v\">18<\/sup> As they sat and were eating, Jesus said, “Most certainly I tell you, one of you will betray me—he who eats with me.”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> They began to be sorrowful, and to ask him one by one, “Surely not I?” And another said, “Surely not I?”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> He answered them, “It is one of the twelve, he who dips with me in the dish. <sup class=\"v\">21<\/sup> For the Son of Man goes, even as it is written about him, but woe to that man by whom the Son of Man is betrayed! It would be better for that man if he had not been born.”"},{"type":"q","id":"14.3","field":"q113","text":"<b>Heart:<\/b> At the meal the disciples each asked, “Surely not I?” (v. 19). Why do you think none of them were certain? How honest are you with yourself about your own weaknesses?"},{"type":"h2","text":"The Lord’s Supper"},{"type":"img","src":"img/mark14-v22.jpg","w":1100,"h":733,"alt":"Bread and a cup of wine on a cloth"},{"type":"p","html":"<sup class=\"v\">22<\/sup> As they were eating, Jesus took bread, and when he had blessed, he broke it, and gave to them, and said, “Take, eat. This is my body.”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> He took the cup, and when he had given thanks, he gave to them. They all drank of it. <sup class=\"v\">24<\/sup> He said to them, “This is my blood of the new covenant, which is poured out for many. <sup class=\"v\">25<\/sup> Most certainly I tell you, I will no more drink of the fruit of the vine, until that day when I drink it anew in God’s Kingdom.” <sup class=\"v\">26<\/sup> When they had sung a hymn, they went out to the Mount of Olives."},{"type":"q","id":"14.4","field":"q114","text":"<b>Heart:<\/b> Consider the image of bread and wine. Jesus said, “Take, eat. This is my body” and “This is my blood of the new covenant” (v. 22, 24). What does the Lord’s Supper mean to you?"},{"type":"h2","text":"Peter’s Promise"},{"type":"p","html":"<sup class=\"v\">27<\/sup> Jesus said to them, “All of you will be made to stumble because of me tonight, for it is written, ‘I will strike the shepherd, and the sheep will be scattered.’ <sup class=\"v\">28<\/sup> However, after I am raised up, I will go before you into Galilee.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> But Peter said to him, “Although all will be offended, yet I will not.”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> Jesus said to him, “Most certainly I tell you, that you today, even this night, before the rooster crows twice, you will deny me three times.”"},{"type":"p","html":"<sup class=\"v\">31<\/sup> But he spoke all the more, “If I must die with you, I will not deny you.” They all said the same thing."},{"type":"q","id":"14.5","field":"q115","text":"<b>Action:<\/b> Peter said, “Although all will be offended, yet I will not” (v. 29). When have you promised more than you were able to keep? What promise to God or to someone else do you need to keep this week?"},{"type":"h2","text":"Jesus Prays in Gethsemane"},{"type":"img","src":"img/mark14-v32.jpg","w":1100,"h":735,"alt":"The twisted trunk of an ancient olive tree"},{"type":"p","html":"<sup class=\"v\">32<\/sup> They came to a place which was named Gethsemane. He said to his disciples, “Sit here, while I pray.” <sup class=\"v\">33<\/sup> He took with him Peter, James, and John, and began to be greatly troubled and distressed. <sup class=\"v\">34<\/sup> He said to them, “My soul is exceedingly sorrowful, even to death. Stay here, and watch.”"},{"type":"p","html":"<sup class=\"v\">35<\/sup> He went forward a little, and fell on the ground, and prayed that, if it were possible, the hour might pass away from him. <sup class=\"v\">36<\/sup> He said, “Abba, Father, all things are possible to you. Please remove this cup from me. However, not what I desire, but what you desire.”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> He came and found them sleeping, and said to Peter, “Simon, are you sleeping? Couldn’t you watch one hour? <sup class=\"v\">38<\/sup> Watch and pray, that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> Again he went away, and prayed, saying the same words. <sup class=\"v\">40<\/sup> Again he returned, and found them sleeping, for their eyes were very heavy, and they didn’t know what to answer him. <sup class=\"v\">41<\/sup> He came the third time, and said to them, “Sleep on now, and take your rest. It is enough. The hour has come. Behold, the Son of Man is betrayed into the hands of sinners. <sup class=\"v\">42<\/sup> Arise! Let’s get going. Behold: he who betrays me is at hand.”"},{"type":"q","id":"14.6","field":"q116","text":"<b>Head:<\/b> Look at the image of the old olive tree. In Gethsemane Jesus prayed, “Not what I desire, but what you desire” (v. 36). What does this prayer show about Jesus and his Father? What is hardest about praying it in your own life?"},{"type":"q","id":"14.7","field":"q117","text":"<b>Action:<\/b> Jesus asked his friends to stay awake with him, but three times they slept (v. 37-41). How can you be present for someone who is going through deep sorrow? Who could you reach out to this week?"},{"type":"h2","text":"Jesus Is Arrested"},{"type":"p","html":"<sup class=\"v\">43<\/sup> Immediately, while he was still speaking, Judas, one of the twelve, came—and with him a multitude with swords and clubs, from the chief priests, the scribes, and the elders. <sup class=\"v\">44<\/sup> Now he who betrayed him had given them a sign, saying, “Whomever I will kiss, that is he. Seize him, and lead him away safely.” <sup class=\"v\">45<\/sup> When he had come, immediately he came to him, and said, “Rabbi! Rabbi!” and kissed him. <sup class=\"v\">46<\/sup> They laid their hands on him, and seized him. <sup class=\"v\">47<\/sup> But a certain one of those who stood by drew his sword, and struck the servant of the high priest, and cut off his ear."},{"type":"p","html":"<sup class=\"v\">48<\/sup> Jesus answered them, “Have you come out, as against a robber, with swords and clubs to seize me? <sup class=\"v\">49<\/sup> I was daily with you in the temple teaching, and you didn’t arrest me. But this is so that the Scriptures might be fulfilled.”"},{"type":"p","html":"<sup class=\"v\">50<\/sup> They all left him, and fled. <sup class=\"v\">51<\/sup> A certain young man followed him, having a linen cloth thrown around himself over his naked body. The young men grabbed him, <sup class=\"v\">52<\/sup> but he left the linen cloth, and fled from them naked."},{"type":"q","id":"14.8","field":"q118","text":"<b>Heart:<\/b> When Jesus was arrested, “they all left him, and fled” (v. 50). How do you think Jesus felt? Have you ever felt abandoned by friends?"},{"type":"h2","text":"Jesus Before the Council"},{"type":"p","html":"<sup class=\"v\">53<\/sup> They led Jesus away to the high priest. All the chief priests, the elders, and the scribes came together with him."},{"type":"p","html":"<sup class=\"v\">54<\/sup> Peter had followed him from a distance, until he came into the court of the high priest. He was sitting with the officers, and warming himself in the light of the fire. <sup class=\"v\">55<\/sup> Now the chief priests and the whole council sought witnesses against Jesus to put him to death, and found none. <sup class=\"v\">56<\/sup> For many gave false testimony against him, and their testimony didn’t agree with each other. <sup class=\"v\">57<\/sup> Some stood up, and gave false testimony against him, saying, <sup class=\"v\">58<\/sup> “We heard him say, ‘I will destroy this temple that is made with hands, and in three days I will build another made without hands.’ ” <sup class=\"v\">59<\/sup> Even so, their testimony didn’t agree."},{"type":"p","html":"<sup class=\"v\">60<\/sup> The high priest stood up in the middle, and asked Jesus, “Have you no answer? What is it which these testify against you?” <sup class=\"v\">61<\/sup> But he stayed quiet, and answered nothing. Again the high priest asked him, “Are you the Christ, the Son of the Blessed?”"},{"type":"p","html":"<sup class=\"v\">62<\/sup> Jesus said, “I am. You will see the Son of Man sitting at the right hand of Power, and coming with the clouds of the sky.”"},{"type":"p","html":"<sup class=\"v\">63<\/sup> The high priest tore his clothes, and said, “What further need have we of witnesses? <sup class=\"v\">64<\/sup> You have heard the blasphemy! What do you think?” They all condemned him to be worthy of death. <sup class=\"v\">65<\/sup> Some began to spit on him, and to cover his face, and to beat him with fists, and to tell him, “Prophesy!” The officers struck him with the palms of their hands."},{"type":"q","id":"14.9","field":"q119","text":"<b>Head:<\/b> Asked if he was the Christ, Jesus answered, “I am” (v. 62). Why do you think he spoke so plainly now after keeping quiet before?"},{"type":"h2","text":"Peter Denies Jesus"},{"type":"img","src":"img/mark14-v66.jpg","w":1100,"h":733,"alt":"A rooster perched on a branch"},{"type":"p","html":"<sup class=\"v\">66<\/sup> As Peter was in the courtyard below, one of the maids of the high priest came, <sup class=\"v\">67<\/sup> and seeing Peter warming himself, she looked at him, and said, “You were also with the Nazarene, Jesus!”"},{"type":"p","html":"<sup class=\"v\">68<\/sup> But he denied it, saying, “I neither know, nor understand what you are saying.” He went out on the porch, and the rooster crowed."},{"type":"p","html":"<sup class=\"v\">69<\/sup> The maid saw him, and began again to tell those who stood by, “This is one of them.” <sup class=\"v\">70<\/sup> But he again denied it. After a little while again those who stood by said to Peter, “You truly are one of them, for you are a Galilean, and your speech shows it.” <sup class=\"v\">71<\/sup> But he began to curse, and to swear, “I don’t know this man of whom you speak!” <sup class=\"v\">72<\/sup> The rooster crowed the second time. Peter remembered the word, how that Jesus said to him, “Before the rooster crows twice, you will deny me three times.” When he thought about that, he wept."},{"type":"q","id":"14.10","field":"q120","text":"<b>Heart:<\/b> Consider the image of the rooster. When the rooster crowed, Peter remembered Jesus’ words, “When he thought about that, he wept” (v. 72). When have you felt the pain of failing someone you love? How does Jesus meet you there?"},{"type":"q","id":"14.11","field":"q121","text":"<b>Heart:<\/b> Which image in this chapter stirs the strongest feelings in you? What are those feelings, and how might they connect with Jesus’ final night?"}],"prayer":"Father in heaven, in the garden Jesus prayed, “All things are possible to you” (14:36), and he trusted your will above his own. Give me wisdom as I read, and help me trust your will above mine."},{"num":15,"hero":{"src":"img/mark15-hero.jpg","w":1100,"h":761,"alt":"A crown of thorns on purple cloth"},"blocks":[{"type":"h2","text":"Jesus Before Pilate"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Immediately in the morning the chief priests, with the elders and scribes, and the whole council, held a consultation, bound Jesus, carried him away, and delivered him up to Pilate. <sup class=\"v\">2<\/sup> Pilate asked him, “Are you the King of the Jews?”"},{"type":"p","html":"He answered, “So you say.”"},{"type":"p","html":"<sup class=\"v\">3<\/sup> The chief priests accused him of many things. <sup class=\"v\">4<\/sup> Pilate again asked him, “Have you no answer? See how many things they testify against you!”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> But Jesus made no further answer, so that Pilate marveled."},{"type":"p","html":"<sup class=\"v\">6<\/sup> Now at the feast he used to release to them one prisoner, whom they asked of him. <sup class=\"v\">7<\/sup> There was one called Barabbas, bound with his fellow insurgents, men who in the insurrection had committed murder. <sup class=\"v\">8<\/sup> The multitude, crying aloud, began to ask him to do as he always did for them. <sup class=\"v\">9<\/sup> Pilate answered them, saying, “Do you want me to release to you the King of the Jews?” <sup class=\"v\">10<\/sup> For he perceived that for envy the chief priests had delivered him up. <sup class=\"v\">11<\/sup> But the chief priests stirred up the multitude, that he should release Barabbas to them instead. <sup class=\"v\">12<\/sup> Pilate again asked them, “What then should I do to him whom you call the King of the Jews?”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> They cried out again, “Crucify him!”"},{"type":"p","html":"<sup class=\"v\">14<\/sup> Pilate said to them, “Why, what evil has he done?”"},{"type":"p","html":"But they cried out exceedingly, “Crucify him!”"},{"type":"p","html":"<sup class=\"v\">15<\/sup> Pilate, wishing to please the multitude, released Barabbas to them, and handed over Jesus, when he had flogged him, to be crucified."},{"type":"q","id":"15.1","field":"q122","text":"<b>Action:<\/b> Pilate, “wishing to please the multitude,” released Barabbas and handed Jesus over (v. 15). When have you been tempted to go along with the crowd rather than do what is right? Where might you need to stand
