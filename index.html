<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Mark</title>
<meta name="description" content="Mark (World English Bible) with photographs and reflection questions.">
<meta name="theme-color" content="#F7F8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111517" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mark">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: a book you read online. One reading column (~66ch) beside a sticky chapter guide; photos run the full column; reflection panels sit in the flow where the book put them. */
  --paper: #F7F8F6;
  --surface: #FFFFFF;
  --ink: #15191C;
  --muted: #5A646A;
  --line: #D9DFDD;
  --teal: #0F6B70;
  --teal-soft: #E3EFEE;
  --panel: #EDF1EF;
  --mark: #FBE38E;
  --mark-ink: #15191C;
  --hl-green: #D4F3C8;
  --hl-blue: #CDE5FA;
  --band: rgba(9, 15, 17, 0.58);
  --display: "Libre Franklin", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: clamp(2.5rem, 6vw, 3.75rem);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111517;
    --surface: #171C1E;
    --ink: #E5E9E7;
    --muted: #9CA7AB;
    --line: #2B3336;
    --teal: #63BFC2;
    --teal-soft: #17292B;
    --panel: #1A2123;
    --mark: #6B5A1F;
    --mark-ink: #FFF6D6;
    --hl-green: rgba(118, 196, 104, 0.34);
    --hl-blue: rgba(104, 160, 232, 0.38);
    --band: rgba(5, 8, 9, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111517;
  --surface: #171C1E;
  --ink: #E5E9E7;
  --muted: #9CA7AB;
  --line: #2B3336;
  --teal: #63BFC2;
  --teal-soft: #17292B;
  --panel: #1A2123;
  --mark: #6B5A1F;
  --mark-ink: #FFF6D6;
  --hl-green: rgba(118, 196, 104, 0.34);
  --hl-blue: rgba(104, 160, 232, 0.38);
  --band: rgba(5, 8, 9, 0.62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: var(--step-1);
  line-height: 1.65;
}
img { max-width: 100%; height: auto; display: block; }
a { color: var(--teal); text-underline-offset: 0.18em; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; border-radius: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; line-height: 1.2; margin: 0; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  font-family: var(--display);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 14px;
}
.brand {
  font-weight: 700; font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink); text-decoration: none; white-space: nowrap; margin-right: auto;
}
.brand span { color: var(--teal); }
.navbtn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1px solid transparent; border-radius: 6px;
  padding: 6px 10px; font-size: var(--step--1); font-weight: 500; color: var(--ink);
  text-decoration: none; cursor: pointer; white-space: nowrap;
}
.navbtn:hover { background: var(--teal-soft); }
.navbtn[aria-current="page"] { border-color: var(--line); background: var(--surface); }
.count {
  font-variant-numeric: tabular-nums; font-size: 0.75rem; font-weight: 600;
  background: var(--teal); color: var(--paper); border-radius: 999px; padding: 1px 7px; min-width: 1.6em; text-align: center;
}
.chapmenu { position: relative; }
.chapmenu > summary { list-style: none; }
.chapmenu > summary::-webkit-details-marker { display: none; }
.chapmenu-panel {
  position: absolute; right: 0; top: calc(100% + 8px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.14);
  padding: 14px; width: 300px;
}
.chapmenu-panel p { margin: 0 0 8px; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.chapgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.chapgrid a {
  display: grid; place-items: center; aspect-ratio: 1; border-radius: 6px;
  text-decoration: none; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums;
  border: 1px solid var(--line); font-size: 0.95rem;
}
.chapgrid a:hover { border-color: var(--teal); color: var(--teal); }
.chapgrid a.done { background: var(--teal-soft); }
.chapgrid a[aria-current="page"] { background: var(--teal); color: var(--paper); border-color: var(--teal); }

.searchbar { border-top: 1px solid var(--line); }
.searchbar[hidden] { display: none; }
.searchbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 20px 16px; }
.searchbar input {
  width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); font-family: var(--display); font-size: 1rem;
}
.results { list-style: none; margin: 10px 0 0; padding: 0; max-height: 55vh; overflow-y: auto; }
.results li + li { border-top: 1px solid var(--line); }
.results button {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 4px; cursor: pointer;
  font-family: var(--body); font-size: 1rem; line-height: 1.45;
}
.results button:hover { background: var(--teal-soft); }
.results .ref { font-family: var(--display); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); display: block; }
.results b { background: var(--mark); color: var(--mark-ink); font-weight: inherit; }
.results-note { font-family: var(--display); font-size: var(--step--1); color: var(--muted); margin: 10px 0 0; }

/* ---------- shared layout ---------- */
main { min-height: 70vh; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.eyebrow { font-family: var(--display); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--teal); margin: 0 0 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--display); font-weight: 600; font-size: 0.95rem;
  padding: 11px 18px; border-radius: 6px; text-decoration: none; cursor: pointer;
  border: 1px solid var(--teal); background: var(--teal); color: var(--paper);
}
.btn.ghost { background: transparent; color: var(--teal); }
.btn:hover { filter: brightness(1.08); }

/* ---------- home ---------- */
.cover {
  display: grid; grid-template-columns: minmax(200px, 330px) 1fr; gap: clamp(28px, 5vw, 64px);
  align-items: center; padding: clamp(32px, 6vw, 72px) 0 clamp(32px, 5vw, 56px);
}
.cover-img { border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
.cover h1 { font-size: var(--step-4); letter-spacing: -0.02em; font-weight: 700; }
.cover .lede { font-size: var(--step-1); color: var(--muted); max-width: 34em; margin: 14px 0 22px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 26px; padding: 0; list-style: none; font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.stats strong { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 1.05rem; margin-right: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.progress-line { font-family: var(--display); font-size: var(--step--1); color: var(--muted); margin: 16px 0 0; }

.welcome {
  display: grid; grid-template-columns: 1fr minmax(240px, 380px); gap: clamp(28px, 5vw, 64px);
  padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line);
}
.welcome h2 { font-size: var(--step-3); margin-bottom: 14px; }
.welcome p { margin: 0 0 1em; max-width: 36em; }
.strips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-self: start; }
.strips img { width: 100%; aspect-ratio: 143 / 374; object-fit: cover; border-radius: 3px; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.section-head h2 { font-size: var(--step-3); }
.section-head p { margin: 0; font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.chapters { padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.card {
  display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--teal); transform: translateY(-2px); }
.card-img { position: relative; aspect-ratio: 16 / 10; background: #222; overflow: hidden; }
.card-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card-num {
  position: absolute; left: 0; bottom: 0; padding: 6px 12px 4px; background: var(--band); color: #fff;
  font-family: var(--display); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.3em;
  display: flex; align-items: baseline; gap: 8px;
}
.card-num b { font-family: var(--body); font-weight: 400; font-size: 1.9rem; letter-spacing: 0; line-height: 1; }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-body ul { list-style: none; margin: 0; padding: 0; font-family: var(--display); font-size: 0.85rem; line-height: 1.4; color: var(--muted); }
.card-body li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-body li:first-child { color: var(--ink); font-weight: 600; white-space: normal; }
.card-meta { margin-top: auto; display: flex; gap: 8px; align-items: center; font-family: var(--display); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); }
.pill.on { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }

.feature { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 0 0 clamp(32px, 5vw, 56px); }
.feature a.tile {
  display: block; padding: 22px 24px; border-radius: 8px; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); background: var(--panel);
}
.feature a.tile:hover { border-color: var(--teal); }
.feature h3 { font-size: var(--step-2); margin-bottom: 6px; }
.feature p { margin: 0; color: var(--muted); font-size: 1rem; }

.about { padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr minmax(220px, 300px); gap: clamp(28px, 5vw, 64px); }
.about h2 { font-size: var(--step-2); margin-bottom: 4px; }
.about h3 { font-size: 1rem; font-weight: 600; color: var(--muted); margin-bottom: 16px; }
.about p { margin: 0 0 0.8em; font-size: 1.05rem; max-width: 40em; }
.about-imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-self: start; }
.about-imgs img { width: 100%; aspect-ratio: 143 / 486; object-fit: cover; border-radius: 3px; }

/* ---------- chapter ---------- */
.hero { position: relative; margin: 24px 0 0; border-radius: 6px; overflow: hidden; background: #1d2326; }
.hero img { width: 100%; max-height: min(64vh, 600px); object-fit: cover; }
.band {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--band); color: #fff;
  padding: 14px clamp(18px, 3vw, 32px) 12px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
}
.band-title { display: flex; flex-direction: column; }
.band .lk { font-family: var(--display); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.42em; }
.band .num { font-family: var(--body); font-size: clamp(4rem, 11vw, 7rem); line-height: 0.82; font-weight: 400; }
.band .meta { font-family: var(--display); font-size: 0.8rem; text-align: right; opacity: 0.92; line-height: 1.5; }

.chapter-grid {
  display: grid; grid-template-columns: 230px minmax(0, 700px); gap: clamp(28px, 5vw, 72px);
  justify-content: center; padding: 36px 0 24px;
}
.guide { position: sticky; top: 76px; align-self: start; font-family: var(--display); font-size: 0.9rem; max-height: calc(100vh - 96px); overflow-y: auto; }
.guide h2 { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.guide ol { list-style: none; margin: 0 0 22px; padding: 0; border-left: 2px solid var(--line); }
.guide li button {
  display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 5px 0 5px 12px; margin-left: -2px; border-left: 2px solid transparent; line-height: 1.35; color: var(--muted);
}
.guide li button:hover { color: var(--ink); }
.guide li button.active { color: var(--ink); border-left-color: var(--teal); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0 0 12px; color: var(--ink); }
.toggle input { width: 18px; height: 18px; accent-color: var(--teal); }
.guide .tally { color: var(--muted); font-variant-numeric: tabular-nums; margin: 0 0 12px; }
.guide-mobile { display: none; }

.reader h2 {
  font-size: 1.3rem; font-weight: 700; margin: 2.2em 0 0.7em; scroll-margin-top: 90px;
}
.reader > :first-child { margin-top: 0; }
.reader p { margin: 0 0 1em; max-width: 66ch; }
.reader p, .reader .poem { scroll-margin-top: 90px; }
sup.v {
  font-family: var(--display); font-weight: 700; font-size: 0.6em; color: var(--teal);
  line-height: 0; vertical-align: 0.6em; margin-right: 0.12em; font-variant-numeric: tabular-nums;
}
.poem { margin: 0 0 1.1em; padding-left: 1.6em; border-left: 2px solid var(--teal-soft); }
.poem .l { display: block; padding-left: 1.2em; text-indent: -1.2em; }
.photo { margin: 1.6em 0; }
.photo img { width: 100%; border-radius: 4px; }
.photo.portrait img { max-height: 760px; width: auto; max-width: 100%; margin: 0 auto; }

.q {
  background: var(--panel); border-left: 3px solid var(--teal); border-radius: 0 6px 6px 0;
  padding: 18px 20px 16px; margin: 1.4em 0; font-family: var(--display); scroll-margin-top: 90px;
}
.q + .q { margin-top: -0.6em; }
.q-num { font-family: var(--display); font-size: 0.78rem; font-weight: 700; color: var(--teal); letter-spacing: 0.06em; margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.q-text { font-size: 1rem; line-height: 1.5; margin: 0 0 12px; }
.q-text b { color: var(--teal); font-family: var(--display); font-weight: 700; }
.q textarea {
  display: block; width: 100%; min-height: 96px; resize: vertical;
  padding: 12px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface);
  font-family: var(--body); font-size: 1.05rem; line-height: 1.55;
}
.q textarea:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
.q-status { min-height: 1.2em; margin: 6px 0 0; font-size: 0.75rem; color: var(--muted); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 28px 0 56px; border-top: 1px solid var(--line); margin-top: 24px; }
.pager a {
  display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink);
  font-family: var(--display); background: var(--surface);
}
.pager a:hover { border-color: var(--teal); }
.pager small { display: block; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.pager strong { font-size: 1.05rem; }
.pager .next { text-align: right; grid-column: 2; }

/* ---------- responses / discussion pages ---------- */
.page { max-width: 820px; margin: 0 auto; padding: clamp(32px, 6vw, 64px) 20px 64px; }
.page h1 { font-size: var(--step-3); margin-bottom: 10px; }
.page .lede { color: var(--muted); margin: 0 0 24px; font-size: 1.05rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 28px; }
.toolbar .note { font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.group { margin: 0 0 34px; }
.group h2 { font-size: 1.15rem; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.group h2 a { font-size: 0.85rem; font-weight: 500; }
.answer { margin: 0 0 20px; }
.answer .q-num { margin-bottom: 2px; }
.answer .q-text { margin-bottom: 8px; color: var(--muted); font-family: var(--display); font-size: 0.95rem; }
.answer .text { white-space: pre-wrap; margin: 0; padding-left: 14px; border-left: 3px solid var(--teal); }
.answer button.link { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; font-family: var(--display); font-size: 0.85rem; text-decoration: underline; text-underline-offset: 0.18em; margin-top: 6px; }
.empty { font-family: var(--display); color: var(--muted); padding: 22px; border: 1px dashed var(--line); border-radius: 8px; }
.copybox { margin: 0 0 24px; }
.copybox[hidden] { display: none; }
.copybox textarea { width: 100%; min-height: 220px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--display); font-size: 0.9rem; }

.types { list-style: none; counter-reset: t; padding: 0; margin: 0; display: grid; gap: 16px; }
.types > li { counter-increment: t; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 16px 64px; position: relative; }
.types > li::before {
  content: counter(t); position: absolute; left: 18px; top: 16px; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; background: var(--teal); color: var(--paper);
  font-family: var(--display); font-weight: 700; font-size: 0.95rem;
}
.types h2 { font-size: 1.1rem; margin: 4px 0 8px; }
.types h2 span { font-weight: 400; color: var(--muted); font-size: 0.9rem; }
.types ol { margin: 0; padding-left: 1.3em; list-style: lower-alpha; font-size: 1.02rem; }
.types ol li { margin: 0 0 6px; }

/* ---------- opening prayer ---------- */
.prayer { margin: 0 0 2em; padding: 16px 22px 16px 20px; max-width: 66ch; background: rgba(200, 150, 62, 0.11);
  border-left: 4px solid #C8963E; border-radius: 0 8px 8px 0; }
.reader .prayer p { margin: 0; max-width: none; }
.reader .prayer .prayer-label { font-family: var(--display); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2em;
  text-transform: uppercase; color: #9A6B1E; margin: 0 0 6px; }
.reader .prayer .prayer-text { font-style: italic; font-size: 1.06rem; line-height: 1.6; }
:root[data-theme="dark"] .reader .prayer .prayer-label { color: #E2B866; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .reader .prayer .prayer-label { color: #E2B866; } }
@media print { .prayer { background: none; } }

/* ---------- master questions and summary ---------- */
.mq-box { margin: 1.4em 0 1.6em; padding: 18px 20px 6px; border: 1px solid var(--line); border-top: 3px solid var(--teal); border-radius: 0 0 8px 8px; background: var(--panel); max-width: 40em; }
.mq-box h3 { font-family: var(--display); font-size: 1.05rem; margin: 0 0 8px; color: var(--teal); letter-spacing: 0.02em; }
.welcome .mq-box p, .mq-box p { margin: 0 0 12px; font-size: 0.97rem; font-family: var(--display); max-width: none; line-height: 1.5; }
.mq-list { margin: 0 0 12px; padding: 0; list-style: none; }
.mq-list li { margin: 0 0 10px; font-family: var(--display); font-size: 0.97rem; line-height: 1.5; }
.mq-list b, .mq-q .q-text b, .sm-q b { color: var(--teal); font-weight: 700; letter-spacing: 0.04em; }
.mq { margin: 2.4em 0 0.4em; padding-top: 1.2em; border-top: 2px solid var(--teal); }

<script type="application/json" id="book-data">{"cover":{"src":"img/cover.jpg","w":853,"h":1280,"alt":"A desert road running toward mountains under a colorful sunrise sky"},"coverAlt":"A desert road running toward mountains under a colorful sunrise sky","welcome":["Mark is the shortest and fastest-moving of the four Gospels. Again and again Mark tells us that Jesus acted “immediately”: calling followers, healing the sick, teaching the crowds and pressing on toward Jerusalem and the cross. Visual Mark invites you to slow down inside that fast-moving story.","Visual Mark sets the full text of Mark, in the World English Bible, beside photographs and questions for reflection. The photographs are not pictures of Bible scenes. They are images from everyday life, chosen to help you connect your own story with the story of Jesus.","As you read, take time with each image. Notice what you see and what you feel. The questions are marked HEAD, HEART and ACTION. Head questions help you understand what the passage says. Heart questions invite you to notice your feelings and attitudes before God. Action questions ask what you will do in response. Use them on your own, with a friend or in a group. The goal is to link LIFE and SCRIPTURE through IMAGES.","You can write your responses right on the page, in the boxes beneath each question, and highlight words in the text that speak to you.","At the end of the book, after Mark 16, you will find two more sections. The Summary reviews the Master Questions for the whole Gospel of Mark, with boxes for your responses. Going Deeper is a short study guide with an overview of the author and the book, historical and cultural insights, a chart of the whole book, its major themes and emotions, and free online resources such as Blue Letter Bible, commentaries and maps."],"strips":[{"src":"img/welcome-1.jpg","w":853,"h":1280,"alt":"Hands holding a black Holy Bible"},{"src":"img/welcome-2.jpg","w":1024,"h":1280,"alt":"A single candle flame reflected in the dark"},{"src":"img/welcome-3.jpg","w":960,"h":1280,"alt":"Footprints along the shore toward the setting sun"}],"chapters":[{"num":1,"hero":{"src":"img/mark01-hero.jpg","w":1100,"h":733,"alt":"A road through barren desert hills in the wilderness"},"blocks":[{"type":"h2","text":"John Prepares the Way"},{"type":"p","html":"<sup class=\"v\">1<\/sup> The beginning of the Good News of Jesus Christ, the Son of God. <sup class=\"v\">2<\/sup> As it is written in the prophets,"},{"type":"poem","lines":["“Behold, I send my messenger before your face,","who will prepare your way before you:","<sup class=\"v\">3<\/sup> the voice of one crying in the wilderness,","‘Make ready the way of the Lord!","Make his paths straight!’ ”"]},{"type":"p","html":"<sup class=\"v\">4<\/sup> John came baptizing in the wilderness and preaching the baptism of repentance for forgiveness of sins. <sup class=\"v\">5<\/sup> All the country of Judea and all those of Jerusalem went out to him. They were baptized by him in the Jordan river, confessing their sins. <sup class=\"v\">6<\/sup> John was clothed with camel’s hair and a leather belt around his waist. He ate locusts and wild honey. <sup class=\"v\">7<\/sup> He preached, saying, “After me comes he who is mightier than I, the thong of whose sandals I am not worthy to stoop down and loosen. <sup class=\"v\">8<\/sup> I baptized you in water, but he will baptize you in the Holy Spirit.”"},{"type":"q","id":"1.1","field":"q1","text":"<b>Heart:<\/b> Look carefully at the image that opens this chapter. Mark’s story begins with “the voice of one crying in the wilderness” (v. 3). Where are the wilderness places in your life right now? How might God be preparing a way through them?"},{"type":"q","id":"1.2","field":"q2","text":"<b>Action:<\/b> John said, “After me comes he who is mightier than I” (v. 7). John’s whole purpose was to point beyond himself. Who has pointed you toward Jesus? Who could you point toward him this week, and how?"},{"type":"h2","text":"Jesus Is Baptized"},{"type":"img","src":"img/mark01-v09.jpg","w":1100,"h":733,"alt":"Sunlight sparkling on rippling water"},{"type":"p","html":"<sup class=\"v\">9<\/sup> In those days, Jesus came from Nazareth of Galilee, and was baptized by John in the Jordan. <sup class=\"v\">10<\/sup> Immediately coming up from the water, he saw the heavens parting, and the Spirit descending on him like a dove. <sup class=\"v\">11<\/sup> A voice came out of the sky, “You are my beloved Son, in whom I am well pleased.”"},{"type":"q","id":"1.3","field":"q3","text":"<b>Heart:<\/b> Consider the image of water in this section. What does it stir in you? At Jesus’ baptism a voice said, “You are my beloved Son, in whom I am well pleased” (v. 11). How would hearing words like these from God change the way you see yourself?"},{"type":"h2","text":"Tested in the Wilderness"},{"type":"p","html":"<sup class=\"v\">12<\/sup> Immediately the Spirit drove him out into the wilderness. <sup class=\"v\">13<\/sup> He was there in the wilderness forty days tempted by Satan. He was with the wild animals; and the angels were serving him."},{"type":"q","id":"1.4","field":"q4","text":"<b>Head:<\/b> Jesus went straight from the joy of his baptism into forty days of testing (v. 12-13). Why do you think the Spirit led him into the wilderness right after his baptism? Have you ever had a high point in life followed quickly by a hard test?"},{"type":"h2","text":"Jesus Calls Four Fishermen"},{"type":"img","src":"img/mark01-v14.jpg","w":1100,"h":733,"alt":"A fisherman casting a net in a forest river"},{"type":"p","html":"<sup class=\"v\">14<\/sup> Now after John was taken into custody, Jesus came into Galilee, preaching the Good News of God’s Kingdom, <sup class=\"v\">15<\/sup> and saying, “The time is fulfilled, and God’s Kingdom is at hand! Repent, and believe in the Good News.”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> Passing along by the sea of Galilee, he saw Simon and Andrew, the brother of Simon, casting a net into the sea, for they were fishermen. <sup class=\"v\">17<\/sup> Jesus said to them, “Come after me, and I will make you into fishers for men.”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Immediately they left their nets, and followed him. <sup class=\"v\">19<\/sup> Going on a little further from there, he saw James the son of Zebedee, and John, his brother, who were also in the boat mending the nets. <sup class=\"v\">20<\/sup> Immediately he called them, and they left their father, Zebedee, in the boat with the hired servants, and went after him."},{"type":"q","id":"1.5","field":"q5","text":"<b>Action:<\/b> If you put yourself in the image of the fisherman, where would you be? What would you be thinking? Simon and Andrew “immediately they left their nets, and followed him” (v. 18). What “nets” would be hardest for you to leave behind? What is one step you could take this week to follow Jesus more closely?"},{"type":"h2","text":"Teaching with Authority"},{"type":"p","html":"<sup class=\"v\">21<\/sup> They went into Capernaum, and immediately on the Sabbath day he entered into the synagogue and taught. <sup class=\"v\">22<\/sup> They were astonished at his teaching, for he taught them as having authority, and not as the scribes. <sup class=\"v\">23<\/sup> Immediately there was in their synagogue a man with an unclean spirit, and he cried out, <sup class=\"v\">24<\/sup> saying, “Ha! What do we have to do with you, Jesus, you Nazarene? Have you come to destroy us? I know you who you are: the Holy One of God!”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> Jesus rebuked him, saying, “Be quiet, and come out of him!”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> The unclean spirit, convulsing him and crying with a loud voice, came out of him. <sup class=\"v\">27<\/sup> They were all amazed, so that they questioned among themselves, saying, “What is this? A new teaching? For with authority he commands even the unclean spirits, and they obey him!” <sup class=\"v\">28<\/sup> The report of him went out immediately everywhere into all the region of Galilee and its surrounding area."},{"type":"q","id":"1.6","field":"q6","text":"<b>Head:<\/b> The people were astonished because Jesus taught “as having authority” (v. 22). What made his teaching so different from what they had heard before? Whose voices carry authority in your life today?"},{"type":"h2","text":"Healing at Simon’s House"},{"type":"p","html":"<sup class=\"v\">29<\/sup> Immediately, when they had come out of the synagogue, they came into the house of Simon and Andrew, with James and John. <sup class=\"v\">30<\/sup> Now Simon’s wife’s mother lay sick with a fever, and immediately they told him about her. <sup class=\"v\">31<\/sup> He came and took her by the hand, and raised her up. The fever left her immediately, and she served them. <sup class=\"v\">32<\/sup> At evening, when the sun had set, they brought to him all who were sick, and those who were possessed by demons. <sup class=\"v\">33<\/sup> All the city was gathered together at the door. <sup class=\"v\">34<\/sup> He healed many who were sick with various diseases, and cast out many demons. He didn’t allow the demons to speak, because they knew him."},{"type":"h2","text":"Jesus Prays in a Quiet Place"},{"type":"img","src":"img/mark01-v35.jpg","w":1100,"h":850,"alt":"A man kneeling in prayer at sunrise among the mountains"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Early in the morning, while it was still dark, he rose up and went out, and departed into a deserted place, and prayed there. <sup class=\"v\">36<\/sup> Simon and those who were with him searched for him. <sup class=\"v\">37<\/sup> They found him and told him, “Everyone is looking for you.”"},{"type":"p","html":"<sup class=\"v\">38<\/sup> He said to them, “Let’s go elsewhere into the next towns, that I may preach there also, because I came out for this reason.” <sup class=\"v\">39<\/sup> He went into their synagogues throughout all Galilee, preaching and casting out demons."},{"type":"q","id":"1.7","field":"q7","text":"<b>Action:<\/b> Look at the image of the person at sunrise. Even with a whole town looking for him, Jesus rose “early, while it was still dark” to pray (v. 35). What crowds out your time with God? When and where will you set aside quiet time with him this week?"},{"type":"h2","text":"Jesus Touches a Man with Leprosy"},{"type":"p","html":"<sup class=\"v\">40<\/sup> A leper came to him, begging him, kneeling down to him, and saying to him, “If you want to, you can make me clean.”"},{"type":"p","html":"<sup class=\"v\">41<\/sup> Being moved with compassion, he stretched out his hand, and touched him, and said to him, “I want to. Be made clean.” <sup class=\"v\">42<\/sup> When he had said this, immediately the leprosy departed from him, and he was made clean. <sup class=\"v\">43<\/sup> He strictly warned him, and immediately sent him out, <sup class=\"v\">44<\/sup> and said to him, “See you say nothing to anybody, but go show yourself to the priest, and offer for your cleansing the things which Moses commanded, for a testimony to them.”"},{"type":"p","html":"<sup class=\"v\">45<\/sup> But he went out, and began to proclaim it much, and to spread about the matter, so that Jesus could no more openly enter into a city, but was outside in desert places. People came to him from everywhere."},{"type":"q","id":"1.8","field":"q8","text":"<b>Action:<\/b> The man with leprosy said, “If you want to, you can make me clean” (v. 40), and Jesus “touched him” (v. 41). Who are the people others avoid touching today? What would it look like for you to reach toward one of them this week?"},{"type":"q","id":"1.9","field":"q9","text":"<b>Heart:<\/b> Choose one image from this chapter that best captures how Mark’s story begins for you. What words would you put with that image?"}],"prayer":"God, in this chapter your Son is moved with compassion and touches a man no one else would touch (1:41). Give me wisdom as I read, and make my heart compassionate like yours."},{"num":2,"hero":{"src":"img/mark02-hero.jpg","w":1100,"h":736,"alt":"Rescue workers carrying a person on a stretcher"},"blocks":[{"type":"h2","text":"Four Friends and a Paralyzed Man"},{"type":"img","src":"img/mark02-v01.jpg","w":1100,"h":734,"alt":"Old clay tiles on a roof"},{"type":"p","html":"<sup class=\"v\">1<\/sup> When he entered again into Capernaum after some days, it was heard that he was in the house. <sup class=\"v\">2<\/sup> Immediately many were gathered together, so that there was no more room, not even around the door; and he spoke the word to them. <sup class=\"v\">3<\/sup> Four people came, carrying a paralytic to him. <sup class=\"v\">4<\/sup> When they could not come near to him for the crowd, they removed the roof where he was. When they had broken it up, they let down the mat that the paralytic was lying on. <sup class=\"v\">5<\/sup> Jesus, seeing their faith, said to the paralytic, “Son, your sins are forgiven you.”"},{"type":"p","html":"<sup class=\"v\">6<\/sup> But there were some of the scribes sitting there, and reasoning in their hearts, <sup class=\"v\">7<\/sup> “Why does this man speak blasphemies like that? Who can forgive sins but God alone?”"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Immediately Jesus, perceiving in his spirit that they so reasoned within themselves, said to them, “Why do you reason these things in your hearts? <sup class=\"v\">9<\/sup> Which is easier, to tell the paralytic, ‘Your sins are forgiven;’ or to say, ‘Arise, and take up your bed, and walk?’ <sup class=\"v\">10<\/sup> But that you may know that the Son of Man has authority on earth to forgive sins”—he said to the paralytic— <sup class=\"v\">11<\/sup> “I tell you, arise, take up your mat, and go to your house.”"},{"type":"p","html":"<sup class=\"v\">12<\/sup> He arose, and immediately took up the mat, and went out in front of them all; so that they were all amazed, and glorified God, saying, “We never saw anything like this!”"},{"type":"q","id":"2.1","field":"q10","text":"<b>Action:<\/b> Consider the image that opens this chapter. Four friends carried a paralyzed man and even broke open a roof to reach Jesus (v. 3-4). Who has carried you when you could not walk on your own? Who could you help carry to Jesus this week, and how?"},{"type":"q","id":"2.2","field":"q11","text":"<b>Head:<\/b> Jesus, “seeing their faith” (v. 5), the faith of the friends, spoke to the man about his sins before healing him. Why do you think Jesus spoke first about forgiveness? How might your faith make a difference for someone else?"},{"type":"q","id":"2.3","field":"q12","text":"<b>Heart:<\/b> Jesus asked, “Which is easier, to tell the paralytic, ‘Your sins are forgiven;’ or to say, ‘Arise, and take up your bed, and walk?’” (v. 9). Which do you most long for in your own life: forgiveness, healing, or both? Explain."},{"type":"h2","text":"Jesus Calls Levi"},{"type":"img","src":"img/mark02-v13.jpg","w":1100,"h":733,"alt":"Friends sharing a meal around a table"},{"type":"p","html":"<sup class=\"v\">13<\/sup> He went out again by the seaside. All the multitude came to him, and he taught them. <sup class=\"v\">14<\/sup> As he passed by, he saw Levi, the son of Alphaeus, sitting at the tax office, and he said to him, “Follow me.” And he arose and followed him."},{"type":"p","html":"<sup class=\"v\">15<\/sup> He was reclining at the table in his house, and many tax collectors and sinners sat down with Jesus and his disciples, for there were many, and they followed him. <sup class=\"v\">16<\/sup> The scribes and the Pharisees, when they saw that he was eating with the sinners and tax collectors, said to his disciples, “Why is it that he eats and drinks with tax collectors and sinners?”"},{"type":"p","html":"<sup class=\"v\">17<\/sup> When Jesus heard it, he said to them, “Those who are healthy have no need for a physician, but those who are sick. I came not to call the righteous, but sinners to repentance.”"},{"type":"q","id":"2.4","field":"q13","text":"<b>Action:<\/b> Look at the image of the shared meal. If you put yourself in this picture, where would you be sitting? Jesus ate with tax collectors and sinners (v. 15-16). Who would be surprising guests at your table? Whom could you invite to share a meal with you?"},{"type":"q","id":"2.5","field":"q14","text":"<b>Heart:<\/b> Jesus said, “Those who are healthy have no need for a physician, but those who are sick” (v. 17). When is it hard for you to admit that you need help?"},{"type":"h2","text":"New Wine and New Wineskins"},{"type":"img","src":"img/mark02-v18.jpg","w":1100,"h":731,"alt":"Rows of wooden barrels in a cellar"},{"type":"p","html":"<sup class=\"v\">18<\/sup> John’s disciples and the Pharisees were fasting, and they came and asked him, “Why do John’s disciples and the disciples of the Pharisees fast, but your disciples don’t fast?”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> Jesus said to them, “Can the groomsmen fast while the bridegroom is with them? As long as they have the bridegroom with them, they can’t fast. <sup class=\"v\">20<\/sup> But the days will come when the bridegroom will be taken away from them, and then they will fast in that day. <sup class=\"v\">21<\/sup> No one sews a piece of unshrunk cloth on an old garment, or else the patch shrinks and the new tears away from the old, and a worse hole is made. <sup class=\"v\">22<\/sup> No one puts new wine into old wineskins, or else the new wine will burst the skins, and the wine pours out, and the skins will be destroyed; but they put new wine into fresh wineskins.”"},{"type":"q","id":"2.6","field":"q15","text":"<b>Head:<\/b> Consider the image for this section. Jesus spoke of new wine that needs fresh wineskins (v. 22). What do you think Jesus meant? What new thing might God be doing in your life that needs a new way of living to hold it?"},{"type":"h2","text":"Lord of the Sabbath"},{"type":"p","html":"<sup class=\"v\">23<\/sup> He was going on the Sabbath day through the grain fields, and his disciples began, as they went, to pluck the ears of grain. <sup class=\"v\">24<\/sup> The Pharisees said to him, “Behold, why do they do that which is not lawful on the Sabbath day?”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> He said to them, “Did you never read what David did, when he had need, and was hungry—he, and those who were with him? <sup class=\"v\">26<\/sup> How he entered into God’s house at the time of Abiathar the high priest, and ate the show bread, which is not lawful to eat except for the priests, and gave also to those who were with him?” <sup class=\"v\">27<\/sup> He said to them, “The Sabbath was made for man, not man for the Sabbath. <sup class=\"v\">28<\/sup> Therefore the Son of Man is lord even of the Sabbath.”"},{"type":"q","id":"2.7","field":"q16","text":"<b>Action:<\/b> Jesus said, “The Sabbath was made for man, not man for the Sabbath” (v. 27). Is your rest a gift you receive or a rule you keep? What is one way you will receive rest as God’s gift this week?"},{"type":"q","id":"2.8","field":"q17","text":"<b>Heart:<\/b> Which image in this chapter do you like least? What questions or feelings does it raise in you? How might those feelings connect with the stories in this chapter?"}],"prayer":"Father in heaven, in Jesus you show that you have authority to forgive sins and that you came to call sinners (2:10, 17). Give me wisdom as I read, and help me receive your forgiveness and offer it to others."},{"num":3,"hero":{"src":"img/mark03-hero.jpg","w":1100,"h":733,"alt":"A crowd of people walking through an old city street"},"blocks":[{"type":"h2","text":"Healing on the Sabbath"},{"type":"img","src":"img/mark03-v01.jpg","w":1100,"h":732,"alt":"Wrinkled old hands resting on a cane"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He entered again into the synagogue, and there was a man there who had his hand withered. <sup class=\"v\">2<\/sup> They watched him, whether he would heal him on the Sabbath day, that they might accuse him. <sup class=\"v\">3<\/sup> He said to the man who had his hand withered, “Stand up.” <sup class=\"v\">4<\/sup> He said to them, “Is it lawful on the Sabbath day to do good, or to do harm? To save a life, or to kill?” But they were silent. <sup class=\"v\">5<\/sup> When he had looked around at them with anger, being grieved at the hardening of their hearts, he said to the man, “Stretch out your hand.” He stretched it out, and his hand was restored as healthy as the other. <sup class=\"v\">6<\/sup> The Pharisees went out, and immediately conspired with the Herodians against him, how they might destroy him."},{"type":"q","id":"3.1","field":"q18","text":"<b>Heart:<\/b> Consider the image of hands in this section. Jesus told the man, “Stretch out your hand” (v. 5), in front of people watching to accuse him. What part of your life do you hide that Jesus might ask you to stretch out to him?"},{"type":"q","id":"3.2","field":"q19","text":"<b>Head:<\/b> Jesus was “grieved at the hardening of their hearts” (v. 5). Why were the leaders so set against a healing on the Sabbath? What tends to harden a heart? What softens it?"},{"type":"h2","text":"Crowds Press Around Jesus"},{"type":"p","html":"<sup class=\"v\">7<\/sup> Jesus withdrew to the sea with his disciples, and a great multitude followed him from Galilee, from Judea, <sup class=\"v\">8<\/sup> from Jerusalem, from Idumaea, beyond the Jordan, and those from around Tyre and Sidon. A great multitude, hearing what great things he did, came to him. <sup class=\"v\">9<\/sup> He spoke to his disciples that a little boat should stay near him because of the crowd, so that they wouldn’t press on him. <sup class=\"v\">10<\/sup> For he had healed many, so that as many as had diseases pressed on him that they might touch him. <sup class=\"v\">11<\/sup> The unclean spirits, whenever they saw him, fell down before him, and cried, “You are the Son of God!” <sup class=\"v\">12<\/sup> He sternly warned them that they should not make him known."},{"type":"q","id":"3.3","field":"q20","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Great crowds came from many places because they heard “what great things he did” (v. 8). What draws people to Jesus today? What draws you?"},{"type":"h2","text":"Jesus Chooses the Twelve"},{"type":"img","src":"img/mark03-v13.jpg","w":1100,"h":449,"alt":"A group of students walking together along a street"},{"type":"p","html":"<sup class=\"v\">13<\/sup> He went up into the mountain, and called to himself those whom he wanted, and they went to him. <sup class=\"v\">14<\/sup> He appointed twelve, that they might be with him, and that he might send them out to preach, <sup class=\"v\">15<\/sup> and to have authority to heal sicknesses and to cast out demons: <sup class=\"v\">16<\/sup> Simon (to whom he gave the name Peter); <sup class=\"v\">17<\/sup> James the son of Zebedee; and John, the brother of James, (whom he called Boanerges, which means, Sons of Thunder); <sup class=\"v\">18<\/sup> Andrew; Philip; Bartholomew; Matthew; Thomas; James, the son of Alphaeus; Thaddaeus; Simon the Zealot; <sup class=\"v\">19<\/sup> and Judas Iscariot, who also betrayed him."},{"type":"q","id":"3.4","field":"q21","text":"<b>Action:<\/b> Consider the image of people walking together. Jesus chose twelve “that they might be with him” (v. 14) before sending them out. What does it mean for you simply to be with Jesus? How will you make time to be with him this week?"},{"type":"q","id":"3.5","field":"q22","text":"<b>Head:<\/b> The Twelve were a mix of fishermen, a tax collector and a zealot. Why do you think Jesus chose such different people? What does that say about the community of faith?"},{"type":"p","html":"Then he came into a house."},{"type":"h2","text":"A House Divided"},{"type":"p","html":"<sup class=\"v\">20<\/sup> The multitude came together again, so that they could not so much as eat bread. <sup class=\"v\">21<\/sup> When his friends heard it, they went out to seize him; for they said, “He is insane.” <sup class=\"v\">22<\/sup> The scribes who came down from Jerusalem said, “He has Beelzebul,” and, “By the prince of the demons he casts out the demons.”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> He summoned them, and said to them in parables, “How can Satan cast out Satan? <sup class=\"v\">24<\/sup> If a kingdom is divided against itself, that kingdom cannot stand. <sup class=\"v\">25<\/sup> If a house is divided against itself, that house cannot stand. <sup class=\"v\">26<\/sup> If Satan has risen up against himself, and is divided, he can’t stand, but has an end. <sup class=\"v\">27<\/sup> But no one can enter into the house of the strong man to plunder unless he first binds the strong man; then he will plunder his house. <sup class=\"v\">28<\/sup> Most certainly I tell you, all sins of the descendants of man will be forgiven, including their blasphemies with which they may blaspheme; <sup class=\"v\">29<\/sup> but whoever may blaspheme against the Holy Spirit never has forgiveness, but is subject to eternal condemnation.” <sup class=\"v\">30<\/sup> —because they said, “He has an unclean spirit.”"},{"type":"q","id":"3.6","field":"q23","text":"<b>Action:<\/b> Some said Jesus was out of his mind; others said he was working with Satan (v. 21-22). What can you learn from the way Jesus responded? How will you respond the next time someone misunderstands you?"},{"type":"h2","text":"Jesus’ True Family"},{"type":"img","src":"img/mark03-v31.jpg","w":1100,"h":733,"alt":"A family walking hand in hand along the beach"},{"type":"p","html":"<sup class=\"v\">31<\/sup> His mother and his brothers came, and standing outside, they sent to him, calling him. <sup class=\"v\">32<\/sup> A multitude was sitting around him, and they told him, “Behold, your mother, your brothers, and your sisters are outside looking for you.”"},{"type":"p","html":"<sup class=\"v\">33<\/sup> He answered them, “Who are my mother and my brothers?” <sup class=\"v\">34<\/sup> Looking around at those who sat around him, he said, “Behold, my mother and my brothers! <sup class=\"v\">35<\/sup> For whoever does the will of God is my brother, my sister, and mother.”"},{"type":"q","id":"3.7","field":"q24","text":"<b>Action:<\/b> Look at the image of a family in this section. Jesus said, “For whoever does the will of God is my brother, my sister, and mother” (v. 35). How has the family of faith been family to you? How could you be family to someone in your church this week?"},{"type":"q","id":"3.8","field":"q25","text":"<b>Heart:<\/b> If you could step into one image in this chapter, which would you choose? Where would you be, and what would you be feeling?"}],"prayer":"God, Jesus showed that your way is to do good and to save a life, even when others object (3:4). Give me wisdom as I read, and help me do good even when it costs me something."},{"num":4,"hero":{"src":"img/mark04-hero.jpg","w":1100,"h":736,"alt":"A farmer working a plowed field"},"blocks":[{"type":"h2","text":"The Farmer and the Seed"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Again he began to teach by the seaside. A great multitude was gathered to him, so that he entered into a boat in the sea, and sat down. All the multitude were on the land by the sea. <sup class=\"v\">2<\/sup> He taught them many things in parables, and told them in his teaching, <sup class=\"v\">3<\/sup> “Listen! Behold, the farmer went out to sow, <sup class=\"v\">4<\/sup> and as he sowed, some seed fell by the road, and the birds came and devoured it. <sup class=\"v\">5<\/sup> Others fell on the rocky ground, where it had little soil, and immediately it sprang up, because it had no depth of soil. <sup class=\"v\">6<\/sup> When the sun had risen, it was scorched; and because it had no root, it withered away. <sup class=\"v\">7<\/sup> Others fell among the thorns, and the thorns grew up, and choked it, and it yielded no fruit. <sup class=\"v\">8<\/sup> Others fell into the good ground, and yielded fruit, growing up and increasing. Some produced thirty times, some sixty times, and some one hundred times as much.” <sup class=\"v\">9<\/sup> He said, “Whoever has ears to hear, let him hear.”"},{"type":"q","id":"4.1","field":"q26","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Jesus told of seed falling on the road, on rocky ground, among thorns and on good soil (v. 3-8). Which kind of soil best describes your heart right now? Explain."},{"type":"h2","text":"The Meaning of the Story"},{"type":"img","src":"img/mark04-v10.jpg","w":1100,"h":639,"alt":"Young seedlings sprouting from the soil"},{"type":"p","html":"<sup class=\"v\">10<\/sup> When he was alone, those who were around him with the twelve asked him about the parables. <sup class=\"v\">11<\/sup> He said to them, “To you is given the mystery of God’s Kingdom, but to those who are outside, all things are done in parables, <sup class=\"v\">12<\/sup> that ‘seeing they may see, and not perceive; and hearing they may hear, and not understand; lest perhaps they should turn again, and their sins should be forgiven them.’ ”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> He said to them, “Don’t you understand this parable? How will you understand all of the parables? <sup class=\"v\">14<\/sup> The farmer sows the word. <sup class=\"v\">15<\/sup> The ones by the road are the ones where the word is sown; and when they have heard, immediately Satan comes, and takes away the word which has been sown in them. <sup class=\"v\">16<\/sup> These in the same way are those who are sown on the rocky places, who, when they have heard the word, immediately receive it with joy. <sup class=\"v\">17<\/sup> They have no root in themselves, but are short-lived. When oppression or persecution arises because of the word, immediately they stumble. <sup class=\"v\">18<\/sup> Others are those who are sown among the thorns. These are those who have heard the word, <sup class=\"v\">19<\/sup> and the cares of this age, and the deceitfulness of riches, and the lusts of other things entering in choke the word, and it becomes unfruitful. <sup class=\"v\">20<\/sup> Those which were sown on the good ground are those who hear the word, and accept it, and bear fruit, some thirty times, some sixty times, and some one hundred times.”"},{"type":"q","id":"4.2","field":"q27","text":"<b>Head:<\/b> Consider the image of the young plant. Jesus said worries, riches and the desire for other things “choke the word” (v. 19). How do these things crowd out God’s word? Which of them threatens to choke it in your life?"},{"type":"q","id":"4.3","field":"q28","text":"<b>Action:<\/b> What helps your heart become good soil where God’s word can grow and bear fruit (v. 20)? What is one habit you could begin this week to make room for God’s word?"},{"type":"h2","text":"A Lamp on a Stand"},{"type":"img","src":"img/mark04-v21.jpg","w":1100,"h":656,"alt":"An ancient green clay oil lamp"},{"type":"p","html":"<sup class=\"v\">21<\/sup> He said to them, “Is the lamp brought to be put under a basket or under a bed? Isn’t it put on a stand? <sup class=\"v\">22<\/sup> For there is nothing hidden, except that it should be made known; neither was anything made secret, but that it should come to light. <sup class=\"v\">23<\/sup> If any man has ears to hear, let him hear.”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> He said to them, “Take heed what you hear. With whatever measure you measure, it will be measured to you, and more will be given to you who hear. <sup class=\"v\">25<\/sup> For whoever has, to him more will be given, and he who doesn’t have, even that which he has will be taken away from him.”"},{"type":"q","id":"4.4","field":"q29","text":"<b>Action:<\/b> Look at the image of the lamp. Jesus said a lamp is not brought in to be put under a basket (v. 21). In what ways is God asking you to let your light be seen? Name one way you will do that this week."},{"type":"h2","text":"Seed That Grows by Itself"},{"type":"p","html":"<sup class=\"v\">26<\/sup> He said, “God’s Kingdom is as if a man should cast seed on the earth, <sup class=\"v\">27<\/sup> and should sleep and rise night and day, and the seed should spring up and grow, though he doesn’t know how. <sup class=\"v\">28<\/sup> For the earth bears fruit: first the blade, then the ear, then the full grain in the ear. <sup class=\"v\">29<\/sup> But when the fruit is ripe, immediately he puts in the sickle, because the harvest has come.”"},{"type":"q","id":"4.5","field":"q30","text":"<b>Head:<\/b> The seed grows “though he doesn’t know how” (v. 27). What does this parable teach about the way God’s kingdom grows? Where have you seen God at work in ways you did not plan or understand?"},{"type":"h2","text":"The Mustard Seed"},{"type":"p","html":"<sup class=\"v\">30<\/sup> He said, “How will we liken God’s Kingdom? Or with what parable will we illustrate it? <sup class=\"v\">31<\/sup> It’s like a grain of mustard seed, which, when it is sown in the earth, though it is less than all the seeds that are on the earth, <sup class=\"v\">32<\/sup> yet when it is sown, grows up, and becomes greater than all the herbs, and puts out great branches, so that the birds of the sky can lodge under its shadow.”"},{"type":"p","html":"<sup class=\"v\">33<\/sup> With many such parables he spoke the word to them, as they were able to hear it. <sup class=\"v\">34<\/sup> Without a parable he didn’t speak to them; but privately to his own disciples he explained everything."},{"type":"q","id":"4.6","field":"q31","text":"<b>Action:<\/b> The tiny mustard seed becomes a plant where birds find shelter (v. 31-32). What small act of faith could you take this week that God might grow into something much larger?"},{"type":"h2","text":"Jesus Calms the Storm"},{"type":"img","src":"img/mark04-v35.jpg","w":1100,"h":733,"alt":"A small sailboat on a lake under a dark storm"},{"type":"p","html":"<sup class=\"v\">35<\/sup> On that day, when evening had come, he said to them, “Let’s go over to the other side.” <sup class=\"v\">36<\/sup> Leaving the multitude, they took him with them, even as he was, in the boat. Other small boats were also with him. <sup class=\"v\">37<\/sup> A big wind storm arose, and the waves beat into the boat, so much that the boat was already filled. <sup class=\"v\">38<\/sup> He himself was in the stern, asleep on the cushion, and they woke him up, and told him, “Teacher, don’t you care that we are dying?”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> He awoke, and rebuked the wind, and said to the sea, “Peace! Be still!” The wind ceased, and there was a great calm. <sup class=\"v\">40<\/sup> He said to them, “Why are you so afraid? How is it that you have no faith?”"},{"type":"p","html":"<sup class=\"v\">41<\/sup> They were greatly afraid, and said to one another, “Who then is this, that even the wind and the sea obey him?”"},{"type":"q","id":"4.7","field":"q32","text":"<b>Heart:<\/b> Put yourself in the image of the storm. Where would you be? What would you be feeling? The disciples cried, “Teacher, don’t you care that we are dying?” (v. 38). When have you felt that God was asleep in your storm?"},{"type":"q","id":"4.8","field":"q33","text":"<b>Heart:<\/b> Jesus asked, “Why are you so afraid? How is it that you have no faith?” (v. 40). What storm in your life right now needs his “Peace! Be still!” (v. 39)?"},{"type":"q","id":"4.9","field":"q34","text":"<b>Heart:<\/b> Images tell stories. Choose an image from this chapter and tell a story about it. How might your story relate to the stories Jesus told?"}],"prayer":"Father in heaven, you sow your word and make it grow in ways we cannot see (4:26–28). Give me wisdom as I read, and let your word take deep root in me and bear fruit."},{"num":5,"hero":{"src":"img/mark05-hero.jpg","w":1100,"h":822,"alt":"A heap of heavy rusty chains"},"blocks":[{"type":"h2","text":"A Man Set Free"},{"type":"img","src":"img/mark05-v01.jpg","w":1100,"h":821,"alt":"Tombs cut into a rock cliff"},{"type":"p","html":"<sup class=\"v\">1<\/sup> They came to the other side of the sea, into the country of the Gadarenes. <sup class=\"v\">2<\/sup> When he had come out of the boat, immediately a man with an unclean spirit met him out of the tombs. <sup class=\"v\">3<\/sup> He lived in the tombs. Nobody could bind him any more, not even with chains, <sup class=\"v\">4<\/sup> because he had been often bound with fetters and chains, and the chains had been torn apart by him, and the fetters broken in pieces. Nobody had the strength to tame him. <sup class=\"v\">5<\/sup> Always, night and day, in the tombs and in the mountains, he was crying out, and cutting himself with stones. <sup class=\"v\">6<\/sup> When he saw Jesus from afar, he ran and bowed down to him, <sup class=\"v\">7<\/sup> and crying out with a loud voice, he said, “What have I to do with you, Jesus, you Son of the Most High God? I adjure you by God, don’t torment me.” <sup class=\"v\">8<\/sup> For he said to him, “Come out of the man, you unclean spirit!”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> He asked him, “What is your name?”"},{"type":"p","html":"He said to him, “My name is Legion, for we are many.” <sup class=\"v\">10<\/sup> He begged him much that he would not send them away out of the country. <sup class=\"v\">11<\/sup> Now on the mountainside there was a great herd of pigs feeding. <sup class=\"v\">12<\/sup> All the demons begged him, saying, “Send us into the pigs, that we may enter into them.”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> At once Jesus gave them permission. The unclean spirits came out and entered into the pigs. The herd of about two thousand rushed down the steep bank into the sea, and they were drowned in the sea. <sup class=\"v\">14<\/sup> Those who fed them fled, and told it in the city and in the country."},{"type":"p","html":"The people came to see what it was that had happened. <sup class=\"v\">15<\/sup> They came to Jesus, and saw him who had been possessed by demons sitting, clothed, and in his right mind, even him who had the legion; and they were afraid. <sup class=\"v\">16<\/sup> Those who saw it declared to them what happened to him who was possessed by demons, and about the pigs. <sup class=\"v\">17<\/sup> They began to beg him to depart from their region."},{"type":"p","html":"<sup class=\"v\">18<\/sup> As he was entering into the boat, he who had been possessed by demons begged him that he might be with him. <sup class=\"v\">19<\/sup> He didn’t allow him, but said to him, “Go to your house, to your friends, and tell them what great things the Lord has done for you, and how he had mercy on you.”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> He went his way, and began to proclaim in Decapolis how Jesus had done great things for him, and everyone marveled."},{"type":"q","id":"5.1","field":"q35","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The man lived among the tombs, bound and unable to be tamed (v. 3-5). What kinds of chains hold people today? Are there chains in your own life that Jesus wants to break?"},{"type":"q","id":"5.2","field":"q36","text":"<b>Head:<\/b> After he was healed, the man was found “sitting, clothed, and in his right mind” (v. 15), yet the townspeople begged Jesus to leave (v. 17). Why might people be afraid of the changes Jesus brings?"},{"type":"q","id":"5.3","field":"q37","text":"<b>Action:<\/b> Jesus sent the man home to tell “what great things the Lord has done for you” (v. 19). What great things has the Lord done for you? Who will you tell about them this week?"},{"type":"h2","text":"A Father Pleads for His Daughter"},{"type":"p","html":"<sup class=\"v\">21<\/sup> When Jesus had crossed back over in the boat to the other side, a great multitude was gathered to him; and he was by the sea. <sup class=\"v\">22<\/sup> Behold, one of the rulers of the synagogue, Jairus by name, came; and seeing him, he fell at his feet, <sup class=\"v\">23<\/sup> and begged him much, saying, “My little daughter is at the point of death. Please come and lay your hands on her, that she may be made healthy, and live.”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> He went with him, and a great multitude followed him, and they pressed upon him on all sides."},{"type":"h2","text":"A Woman Touches Jesus’ Cloak"},{"type":"img","src":"img/mark05-v25.jpg","w":1100,"h":825,"alt":"A hand reaching toward the light in a blue sky"},{"type":"p","html":"<sup class=\"v\">25<\/sup> A certain woman, who had a discharge of blood for twelve years, <sup class=\"v\">26<\/sup> and had suffered many things by many physicians, and had spent all that she had, and was no better, but rather grew worse, <sup class=\"v\">27<\/sup> having heard the things concerning Jesus, came up behind him in the crowd, and touched his clothes. <sup class=\"v\">28<\/sup> For she said, “If I just touch his clothes, I will be made well.” <sup class=\"v\">29<\/sup> Immediately the flow of her blood was dried up, and she felt in her body that she was healed of her affliction."},{"type":"p","html":"<sup class=\"v\">30<\/sup> Immediately Jesus, perceiving in himself that the power had gone out from him, turned around in the crowd, and asked, “Who touched my clothes?”"},{"type":"p","html":"<sup class=\"v\">31<\/sup> His disciples said to him, “You see the multitude pressing against you, and you say, ‘Who touched me?’ ”"},{"type":"p","html":"<sup class=\"v\">32<\/sup> He looked around to see her who had done this thing. <sup class=\"v\">33<\/sup> But the woman, fearing and trembling, knowing what had been done to her, came and fell down before him, and told him all the truth."},{"type":"p","html":"<sup class=\"v\">34<\/sup> He said to her, “Daughter, your faith has made you well. Go in peace, and be cured of your disease.”"},{"type":"q","id":"5.4","field":"q38","text":"<b>Heart:<\/b> Consider the image of the reaching hand. The woman thought, “If I just touch his clothes, I will be made well” (v. 28). What do you reach out to Jesus for right now?"},{"type":"q","id":"5.5","field":"q39","text":"<b>Head:<\/b> Jesus stopped in the crowd to find the woman and called her “Daughter” (v. 34). Why do you think he made her healing known to everyone? What does this show about how Jesus sees people others overlook?"},{"type":"h2","text":"Jairus’s Daughter Lives"},{"type":"img","src":"img/mark05-v35.jpg","w":1100,"h":734,"alt":"A smiling young girl with braided hair"},{"type":"p","html":"<sup class=\"v\">35<\/sup> While he was still speaking, people came from the synagogue ruler’s house saying, “Your daughter is dead. Why bother the Teacher any more?”"},{"type":"p","html":"<sup class=\"v\">36<\/sup> But Jesus, when he heard the message spoken, immediately said to the ruler of the synagogue, “Don’t be afraid, only believe.” <sup class=\"v\">37<\/sup> He allowed no one to follow him, except Peter, James, and John the brother of James. <sup class=\"v\">38<\/sup> He came to the synagogue ruler’s house, and he saw an uproar, weeping, and great wailing. <sup class=\"v\">39<\/sup> When he had entered in, he said to them, “Why do you make an uproar and weep? The child is not dead, but is asleep.”"},{"type":"p","html":"<sup class=\"v\">40<\/sup> They ridiculed him. But he, having put them all out, took the father of the child, her mother, and those who were with him, and went in where the child was lying. <sup class=\"v\">41<\/sup> Taking the child by the hand, he said to her, “Talitha cumi!” which means, being interpreted, “Girl, I tell you, get up!” <sup class=\"v\">42<\/sup> Immediately the girl rose up and walked, for she was twelve years old. They were amazed with great amazement. <sup class=\"v\">43<\/sup> He strictly ordered them that no one should know this, and commanded that something should be given to her to eat."},{"type":"q","id":"5.6","field":"q40","text":"<b>Action:<\/b> Jesus told Jairus, “Don’t be afraid, only believe” (v. 36). What fear makes it hard for you to trust God right now? What step of trust will you take this week?"},{"type":"q","id":"5.7","field":"q41","text":"<b>Heart:<\/b> Look at the image for this section. Jesus took the girl by the hand and said, “Girl, I tell you, get up!” (v. 41). What in your life feels dead or asleep that you long to hear Jesus call back to life?"},{"type":"q","id":"5.8","field":"q42","text":"<b>Heart:<\/b> Which image in this chapter connects most with your own story? Explain why."}],"prayer":"God, you have power over evil, sickness and death, and you tell us, “Don’t be afraid, only believe” (5:36). Give me wisdom as I read, and help me trust you where I feel bound or afraid."},{"num":6,"hero":{"src":"img/mark06-hero.jpg","w":1100,"h":733,"alt":"Carpenter’s chisels on a wooden bench"},"blocks":[{"type":"h2","text":"Without Honor at Home"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He went out from there. He came into his own country, and his disciples followed him. <sup class=\"v\">2<\/sup> When the Sabbath had come, he began to teach in the synagogue, and many hearing him were astonished, saying, “Where did this man get these things?” and, “What is the wisdom that is given to this man, that such mighty works come about by his hands? <sup class=\"v\">3<\/sup> Isn’t this the carpenter, the son of Mary, and brother of James, Joses, Judah, and Simon? Aren’t his sisters here with us?” They were offended at him."},{"type":"p","html":"<sup class=\"v\">4<\/sup> Jesus said to them, “A prophet is not without honor, except in his own country, and among his own relatives, and in his own house.” <sup class=\"v\">5<\/sup> He could do no mighty work there, except that he laid his hands on a few sick people, and healed them. <sup class=\"v\">6<\/sup> He marveled because of their unbelief."},{"type":"q","id":"6.1","field":"q43","text":"<b>Head:<\/b> Look at the image that opens this chapter. The people of Nazareth asked, “Isn’t this the carpenter?” (v. 3) and took offense. Why did they find it so hard to accept him? When has familiarity made it hard for you to see God at work in someone?"},{"type":"q","id":"6.2","field":"q44","text":"<b>Heart:<\/b> Jesus “marveled because of their unbelief” (v. 6). What do you think amazes Jesus about your faith, or about your lack of it?"},{"type":"p","html":"He went around the villages teaching."},{"type":"h2","text":"Jesus Sends Out the Twelve"},{"type":"img","src":"img/mark06-v07.jpg","w":1100,"h":733,"alt":"A dusty dirt road in golden light"},{"type":"p","html":"<sup class=\"v\">7<\/sup> He called to himself the twelve, and began to send them out two by two; and he gave them authority over the unclean spirits. <sup class=\"v\">8<\/sup> He commanded them that they should take nothing for their journey, except a staff only: no bread, no wallet, no money in their purse, <sup class=\"v\">9<\/sup> but to wear sandals, and not put on two tunics. <sup class=\"v\">10<\/sup> He said to them, “Wherever you enter into a house, stay there until you depart from there. <sup class=\"v\">11<\/sup> Whoever will not receive you nor hear you, as you depart from there, shake off the dust that is under your feet for a testimony against them. Assuredly, I tell you, it will be more tolerable for Sodom and Gomorrah in the day of judgment than for that city!”"},{"type":"p","html":"<sup class=\"v\">12<\/sup> They went out and preached that people should repent. <sup class=\"v\">13<\/sup> They cast out many demons, and anointed many with oil who were sick, and healed them."},{"type":"q","id":"6.3","field":"q45","text":"<b>Head:<\/b> Consider the image of the dusty road. Jesus sent the Twelve out with nothing but a staff, sandals and the clothes they wore (v. 8-9). Why do you think he sent them with so little? What would it be like to depend on God and others so completely?"},{"type":"h2","text":"The Death of John the Baptist"},{"type":"p","html":"<sup class=\"v\">14<\/sup> King Herod heard this, for his name had become known, and he said, “John the Baptizer has risen from the dead, and therefore these powers are at work in him.” <sup class=\"v\">15<\/sup> But others said, “He is Elijah.” Others said, “He is a prophet, or like one of the prophets.” <sup class=\"v\">16<\/sup> But Herod, when he heard this, said, “This is John, whom I beheaded. He has risen from the dead.” <sup class=\"v\">17<\/sup> For Herod himself had sent out and arrested John, and bound him in prison for the sake of Herodias, his brother Philip’s wife, for he had married her. <sup class=\"v\">18<\/sup> For John said to Herod, “It is not lawful for you to have your brother’s wife.” <sup class=\"v\">19<\/sup> Herodias set herself against him, and desired to kill him, but she couldn’t, <sup class=\"v\">20<\/sup> for Herod feared John, knowing that he was a righteous and holy man, and kept him safe. When he heard him, he did many things, and he heard him gladly."},{"type":"p","html":"<sup class=\"v\">21<\/sup> Then a convenient day came, that Herod on his birthday made a supper for his nobles, the high officers, and the chief men of Galilee. <sup class=\"v\">22<\/sup> When the daughter of Herodias herself came in and danced, she pleased Herod and those sitting with him. The king said to the young lady, “Ask me whatever you want, and I will give it to you.” <sup class=\"v\">23<\/sup> He swore to her, “Whatever you shall ask of me, I will give you, up to half of my kingdom.”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> She went out, and said to her mother, “What shall I ask?”"},{"type":"p","html":"She said, “The head of John the Baptizer.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> She came in immediately with haste to the king, and asked, “I want you to give me right now the head of John the Baptizer on a platter.”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> The king was exceedingly sorry, but for the sake of his oaths, and of his dinner guests, he didn’t wish to refuse her. <sup class=\"v\">27<\/sup> Immediately the king sent out a soldier of his guard, and commanded to bring John’s head, and he went and beheaded him in the prison, <sup class=\"v\">28<\/sup> and brought his head on a platter, and gave it to the young lady; and the young lady gave it to her mother."},{"type":"p","html":"<sup class=\"v\">29<\/sup> When his disciples heard this, they came and took up his corpse, and laid it in a tomb."},{"type":"q","id":"6.4","field":"q46","text":"<b>Heart:<\/b> Herod “heard him gladly” (v. 20) yet killed John to keep a promise and save face (v. 26). When have you been tempted to do the wrong thing to protect your reputation?"},{"type":"h2","text":"Jesus Feeds Five Thousand"},{"type":"img","src":"img/mark06-v30.jpg","w":1100,"h":729,"alt":"A basket with bread, fish and fruit"},{"type":"p","html":"<sup class=\"v\">30<\/sup> The apostles gathered themselves together to Jesus, and they told him all things, whatever they had done, and whatever they had taught. <sup class=\"v\">31<\/sup> He said to them, “You come apart into a deserted place, and rest awhile.” For there were many coming and going, and they had no leisure so much as to eat. <sup class=\"v\">32<\/sup> They went away in the boat to a deserted place by themselves. <sup class=\"v\">33<\/sup> They saw them going, and many recognized him and ran there on foot from all the cities. They arrived before them and came together to him. <sup class=\"v\">34<\/sup> Jesus came out, saw a great multitude, and he had compassion on them, because they were like sheep without a shepherd, and he began to teach them many things. <sup class=\"v\">35<\/sup> When it was late in the day, his disciples came to him, and said, “This place is deserted, and it is late in the day. <sup class=\"v\">36<\/sup> Send them away, that they may go into the surrounding country and villages, and buy themselves bread, for they have nothing to eat.”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> But he answered them, “You give them something to eat.”"},{"type":"p","html":"They asked him, “Shall we go and buy two hundred denarii worth of bread, and give them something to eat?”"},{"type":"p","html":"<sup class=\"v\">38<\/sup> He said to them, “How many loaves do you have? Go see.”"},{"type":"p","html":"When they knew, they said, “Five, and two fish.”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> He commanded them that everyone should sit down in groups on the green grass. <sup class=\"v\">40<\/sup> They sat down in ranks, by hundreds and by fifties. <sup class=\"v\">41<\/sup> He took the five loaves and the two fish, and looking up to heaven, he blessed and broke the loaves, and he gave to his disciples to set before them, and he divided the two fish among them all. <sup class=\"v\">42<\/sup> They all ate, and were filled. <sup class=\"v\">43<\/sup> They took up twelve baskets full of broken pieces and also of the fish. <sup class=\"v\">44<\/sup> Those who ate the loaves were five thousand men."},{"type":"q","id":"6.5","field":"q47","text":"<b>Action:<\/b> Look at the image of the bread. Jesus asked the disciples, “How many loaves do you have?” (v. 38), and they found only five loaves and two fish. What little do you have that Jesus might use for many? How will you offer it to him this week?"},{"type":"q","id":"6.6","field":"q48","text":"<b>Action:<\/b> Jesus had compassion on the crowd “because they were like sheep without a shepherd” (v. 34). Who around you seems like a sheep without a shepherd? How could you show them Jesus’ compassion this week?"},{"type":"h2","text":"Jesus Walks on the Water"},{"type":"img","src":"img/mark06-v45.jpg","w":1100,"h":733,"alt":"Moonlight over a dark sea with a small boat"},{"type":"p","html":"<sup class=\"v\">45<\/sup> Immediately he made his disciples get into the boat, and to go ahead to the other side, to Bethsaida, while he himself sent the multitude away. <sup class=\"v\">46<\/sup> After he had taken leave of them, he went up the mountain to pray."},{"type":"p","html":"<sup class=\"v\">47<\/sup> When evening had come, the boat was in the middle of the sea, and he was alone on the land. <sup class=\"v\">48<\/sup> Seeing them distressed in rowing, for the wind was contrary to them, about the fourth watch of the night he came to them, walking on the sea, and he would have passed by them, <sup class=\"v\">49<\/sup> but they, when they saw him walking on the sea, supposed that it was a ghost, and cried out; <sup class=\"v\">50<\/sup> for they all saw him, and were troubled. But he immediately spoke with them, and said to them, “Cheer up! It is I! Don’t be afraid.” <sup class=\"v\">51<\/sup> He got into the boat with them; and the wind ceased, and they were very amazed among themselves, and marveled; <sup class=\"v\">52<\/sup> for they hadn’t understood about the loaves, but their hearts were hardened."},{"type":"q","id":"6.7","field":"q49","text":"<b>Heart:<\/b> Put yourself in the image of the lake at night. Where would you be? Jesus said, “Cheer up! It is I! Don’t be afraid” (v. 50). How do you hear Jesus speaking in the storms of your life?"},{"type":"h2","text":"Healing in Gennesaret"},{"type":"p","html":"<sup class=\"v\">53<\/sup> When they had crossed over, they came to land at Gennesaret, and moored to the shore. <sup class=\"v\">54<\/sup> When they had come out of the boat, immediately the people recognized him, <sup class=\"v\">55<\/sup> and ran around that whole region, and began to bring those who were sick, on their mats, to where they heard he was. <sup class=\"v\">56<\/sup> Wherever he entered, into villages, or into cities, or into the country, they laid the sick in the marketplaces, and begged him that they might just touch the fringe of his garment; and as many as touched him were made well."},{"type":"q","id":"6.8","field":"q50","text":"<b>Head:<\/b> People brought the sick on mats and begged just to touch the fringe of Jesus’ garment (v. 55-56). What does this tell you about how people saw Jesus? How do you see him?"},{"type":"q","id":"6.9","field":"q51","text":"<b>Heart:<\/b> Choose the image in this chapter that you find most hopeful. What makes it hopeful for you?"}],"prayer":"Father in heaven, your Son had compassion on the crowds because they were like sheep without a shepherd (6:34). Give me wisdom as I read, and help me share what I have with people in need."},{"num":7,"hero":{"src":"img/mark07-hero.jpg","w":1100,"h":733,"alt":"Water poured from a jug over a person’s hands"},"blocks":[{"type":"h2","text":"Traditions and the Heart"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Then the Pharisees and some of the scribes gathered together to him, having come from Jerusalem. <sup class=\"v\">2<\/sup> Now when they saw some of his disciples eating bread with defiled, that is unwashed, hands, they found fault. <sup class=\"v\">3<\/sup> (For the Pharisees and all the Jews don’t eat unless they wash their hands and forearms, holding to the tradition of the elders. <sup class=\"v\">4<\/sup> They don’t eat when they come from the marketplace unless they bathe themselves, and there are many other things, which they have received to hold to: washings of cups, pitchers, bronze vessels, and couches.) <sup class=\"v\">5<\/sup> The Pharisees and the scribes asked him, “Why don’t your disciples walk according to the tradition of the elders, but eat their bread with unwashed hands?”"},{"type":"p","html":"<sup class=\"v\">6<\/sup> He answered them, “Well did Isaiah prophesy of you hypocrites, as it is written,"},{"type":"poem","lines":["‘This people honors me with their lips,","but their heart is far from me.","<sup class=\"v\">7<\/sup> But they worship me in vain,","teaching as doctrines the commandments of men.’"]},{"type":"p","html":"<sup class=\"v\">8<\/sup> “For you set aside the commandment of God, and hold tightly to the tradition of men—the washing of pitchers and cups, and you do many other such things.” <sup cl
