apart from the crowd this week?"},{"type":"q","id":"15.2","field":"q123","text":"<b>Heart:<\/b> Barabbas, a guilty man, went free while Jesus, an innocent man, was condemned. How might Barabbas have felt? How does his story connect with yours?"},{"type":"h2","text":"The Soldiers Mock Jesus"},{"type":"p","html":"<sup class=\"v\">16<\/sup> The soldiers led him away within the court, which is the Praetorium; and they called together the whole cohort. <sup class=\"v\">17<\/sup> They clothed him with purple, and weaving a crown of thorns, they put it on him. <sup class=\"v\">18<\/sup> They began to salute him, “Hail, King of the Jews!” <sup class=\"v\">19<\/sup> They struck his head with a reed, and spat on him, and bowing their knees, did homage to him. <sup class=\"v\">20<\/sup> When they had mocked him, they took the purple off him, and put his own garments on him. They led him out to crucify him."},{"type":"q","id":"15.3","field":"q124","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The soldiers dressed Jesus in purple, crowned him with thorns and mocked him as king (v. 17-18). How do you respond to the image of a king who suffers?"},{"type":"h2","text":"The Crucifixion"},{"type":"img","src":"img/mark15-v21.jpg","w":1100,"h":870,"alt":"Three crosses against the sunset"},{"type":"p","html":"<sup class=\"v\">21<\/sup> They compelled one passing by, coming from the country, Simon of Cyrene, the father of Alexander and Rufus, to go with them, that he might bear his cross. <sup class=\"v\">22<\/sup> They brought him to the place called Golgotha, which is, being interpreted, “The place of a skull.” <sup class=\"v\">23<\/sup> They offered him wine mixed with myrrh to drink, but he didn’t take it."},{"type":"p","html":"<sup class=\"v\">24<\/sup> Crucifying him, they parted his garments among them, casting lots on them, what each should take. <sup class=\"v\">25<\/sup> It was the third hour, and they crucified him. <sup class=\"v\">26<\/sup> The superscription of his accusation was written over him, “THE KING OF THE JEWS.” <sup class=\"v\">27<\/sup> With him they crucified two robbers; one on his right hand, and one on his left. <sup class=\"v\">28<\/sup> The Scripture was fulfilled, which says, “He was counted with transgressors.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> Those who passed by blasphemed him, wagging their heads, and saying, “Ha! You who destroy the temple, and build it in three days, <sup class=\"v\">30<\/sup> save yourself, and come down from the cross!”"},{"type":"p","html":"<sup class=\"v\">31<\/sup> Likewise, also the chief priests mocking among themselves with the scribes said, “He saved others. He can’t save himself. <sup class=\"v\">32<\/sup> Let the Christ, the King of Israel, now come down from the cross, that we may see and believe him.” Those who were crucified with him also insulted him."},{"type":"q","id":"15.4","field":"q125","text":"<b>Head:<\/b> Consider the image of the three crosses. People passing by shouted, “Save yourself, and come down from the cross!” (v. 30). Why did Jesus not come down? What does this tell you about his love?"},{"type":"q","id":"15.5","field":"q126","text":"<b>Action:<\/b> Simon of Cyrene was compelled to carry Jesus’ cross (v. 21). Have you ever been asked to carry a burden you did not choose? Whose burden could you help carry this week?"},{"type":"h2","text":"The Death of Jesus"},{"type":"img","src":"img/mark15-v33.jpg","w":1100,"h":733,"alt":"A dim sun behind dark clouds"},{"type":"p","html":"<sup class=\"v\">33<\/sup> When the sixth hour had come, there was darkness over the whole land until the ninth hour. <sup class=\"v\">34<\/sup> At the ninth hour Jesus cried with a loud voice, saying, “Eloi, Eloi, lama sabachthani?” which is, being interpreted, “My God, my God, why have you forsaken me?”"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Some of those who stood by, when they heard it, said, “Behold, he is calling Elijah.”"},{"type":"p","html":"<sup class=\"v\">36<\/sup> One ran, and filling a sponge full of vinegar, put it on a reed, and gave it to him to drink, saying, “Let him be. Let’s see whether Elijah comes to take him down.”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> Jesus cried out with a loud voice, and gave up the spirit. <sup class=\"v\">38<\/sup> The veil of the temple was torn in two from the top to the bottom. <sup class=\"v\">39<\/sup> When the centurion, who stood by opposite him, saw that he cried out like this and breathed his last, he said, “Truly this man was the Son of God!”"},{"type":"p","html":"<sup class=\"v\">40<\/sup> There were also women watching from afar, among whom were both Mary Magdalene, and Mary the mother of James the less and of Joses, and Salome; <sup class=\"v\">41<\/sup> who, when he was in Galilee, followed him and served him; and many other women who came up with him to Jerusalem."},{"type":"q","id":"15.6","field":"q127","text":"<b>Heart:<\/b> Look at the image for this section. Jesus cried, “My God, my God, why have you forsaken me?” (v. 34). When have you felt forsaken? How does it help to know Jesus prayed these words?"},{"type":"q","id":"15.7","field":"q128","text":"<b>Head:<\/b> The centurion said, “Truly this man was the Son of God!” (v. 39). What do you think he saw that changed his mind? What leads you to the same conclusion?"},{"type":"h2","text":"The Burial of Jesus"},{"type":"img","src":"img/mark15-v42.jpg","w":1100,"h":734,"alt":"A tomb entrance cut into rock"},{"type":"p","html":"<sup class=\"v\">42<\/sup> When evening had now come, because it was the Preparation Day, that is, the day before the Sabbath, <sup class=\"v\">43<\/sup> Joseph of Arimathaea, a prominent council member who also himself was looking for God’s Kingdom, came. He boldly went in to Pilate, and asked for Jesus’ body. <sup class=\"v\">44<\/sup> Pilate marveled if he were already dead; and summoning the centurion, he asked him whether he had been dead long. <sup class=\"v\">45<\/sup> When he found out from the centurion, he granted the body to Joseph. <sup class=\"v\">46<\/sup> He bought a linen cloth, and taking him down, wound him in the linen cloth, and laid him in a tomb which had been cut out of a rock. He rolled a stone against the door of the tomb. <sup class=\"v\">47<\/sup> Mary Magdalene and Mary, the mother of Joses, saw where he was laid."},{"type":"q","id":"15.8","field":"q129","text":"<b>Action:<\/b> Consider the image of the tomb. Joseph of Arimathea “boldly went in to Pilate” to ask for Jesus’ body (v. 43). What act of courage might faith call you to this week?"},{"type":"q","id":"15.9","field":"q130","text":"<b>Heart:<\/b> As you look at the images in this chapter, what do you think these images are trying to say to you? How do you respond?"}],"prayer":"God, at the cross you showed how far your love will go, and a Roman soldier saw that Jesus was your Son (15:39). Give me wisdom as I read, and open my eyes to see who Jesus is."},{"num":16,"hero":{"src":"img/mark16-hero.jpg","w":1100,"h":619,"alt":"A rock tomb with its round stone rolled aside"},"blocks":[{"type":"h2","text":"Jesus Is Risen"},{"type":"p","html":"<sup class=\"v\">1<\/sup> When the Sabbath was past, Mary Magdalene, and Mary the mother of James, and Salome, bought spices, that they might come and anoint him. <sup class=\"v\">2<\/sup> Very early on the first day of the week, they came to the tomb when the sun had risen. <sup class=\"v\">3<\/sup> They were saying among themselves, “Who will roll away the stone from the door of the tomb for us?” <sup class=\"v\">4<\/sup> for it was very big. Looking up, they saw that the stone was rolled back."},{"type":"p","html":"<sup class=\"v\">5<\/sup> Entering into the tomb, they saw a young man sitting on the right side, dressed in a white robe, and they were amazed. <sup class=\"v\">6<\/sup> He said to them, “Don’t be amazed. You seek Jesus, the Nazarene, who has been crucified. He has risen. He is not here. Behold, the place where they laid him! <sup class=\"v\">7<\/sup> But go, tell his disciples and Peter, ‘He goes before you into Galilee. There you will see him, as he said to you.’ ”"},{"type":"p","html":"<sup class=\"v\">8<\/sup> They went out, and fled from the tomb, for trembling and astonishment had come on them. They said nothing to anyone; for they were afraid."},{"type":"q","id":"16.1","field":"q131","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The women went to the tomb wondering, “Who will roll away the stone from the door of the tomb for us?” (v. 3). What stone in your life seems too heavy to move?"},{"type":"q","id":"16.2","field":"q132","text":"<b>Head:<\/b> The angel said, “Don’t be amazed. You seek Jesus, the Nazarene, who has been crucified. He has risen. He is not here” (v. 6). What does the resurrection of Jesus mean for you today?"},{"type":"q","id":"16.3","field":"q133","text":"<b>Head:<\/b> The women fled from the tomb “for trembling and astonishment had come on them” (v. 8). Why might the good news of the resurrection be frightening as well as joyful?"},{"type":"h2","text":"Jesus Appears to Mary Magdalene"},{"type":"img","src":"img/mark16-v09.jpg","w":1100,"h":733,"alt":"Three people singing joyfully with arms raised"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Now when he had risen early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons. <sup class=\"v\">10<\/sup> She went and told those who had been with him, as they mourned and wept. <sup class=\"v\">11<\/sup> When they heard that he was alive, and had been seen by her, they disbelieved."},{"type":"q","id":"16.4","field":"q134","text":"<b>Action:<\/b> Consider the image for this section. Mary Magdalene told the others, but “they disbelieved” (v. 11). How do you share good news when people do not believe you? Who will you share it with this week?"},{"type":"h2","text":"Jesus Appears to Two Followers"},{"type":"p","html":"<sup class=\"v\">12<\/sup> After these things he was revealed in another form to two of them, as they walked, on their way into the country. <sup class=\"v\">13<\/sup> They went away and told it to the rest. They didn’t believe them, either."},{"type":"h2","text":"Jesus Sends Out His Followers"},{"type":"img","src":"img/mark16-v14.jpg","w":1100,"h":550,"alt":"A map of the world lit at night"},{"type":"p","html":"<sup class=\"v\">14<\/sup> Afterward he was revealed to the eleven themselves as they sat at the table, and he rebuked them for their unbelief and hardness of heart, because they didn’t believe those who had seen him after he had risen. <sup class=\"v\">15<\/sup> He said to them, “Go into all the world, and preach the Good News to the whole creation. <sup class=\"v\">16<\/sup> He who believes and is baptized will be saved; but he who disbelieves will be condemned. <sup class=\"v\">17<\/sup> These signs will accompany those who believe: in my name they will cast out demons; they will speak with new languages; <sup class=\"v\">18<\/sup> they will take up serpents; and if they drink any deadly thing, it will in no way hurt them; they will lay hands on the sick, and they will recover.”"},{"type":"q","id":"16.5","field":"q135","text":"<b>Head:<\/b> Jesus rebuked the Eleven for their “unbelief and hardness of heart” (v. 14), yet still sent them out. What does this tell you about the people God chooses to use?"},{"type":"q","id":"16.6","field":"q136","text":"<b>Action:<\/b> Look at the image of the map. Jesus said, “Go into all the world, and preach the Good News to the whole creation” (v. 15). Where is your “world” — the places and people God has given you? Whom in that world will you share the Good News with?"},{"type":"h2","text":"Jesus Is Taken Up to Heaven"},{"type":"img","src":"img/mark16-v19.jpg","w":1100,"h":504,"alt":"Sunbeams breaking through clouds over green hills"},{"type":"p","html":"<sup class=\"v\">19<\/sup> So then the Lord, after he had spoken to them, was received up into heaven, and sat down at the right hand of God. <sup class=\"v\">20<\/sup> They went out, and preached everywhere, the Lord working with them, and confirming the word by the signs that followed. Amen."},{"type":"q","id":"16.7","field":"q137","text":"<b>Heart:<\/b> Consider the image of the sky. Jesus was received up into heaven, and the disciples “went out, and preached everywhere, the Lord working with them” (v. 20). How have you seen the Lord working with you?"},{"type":"q","id":"16.8","field":"q138","text":"<b>Action:<\/b> Mark’s Gospel began with “the beginning of the Good News of Jesus Christ” (1:1). Now that you have read the whole story, how would you tell the Good News in your own words? Who will you tell?"},{"type":"q","id":"16.9","field":"q139","text":"<b>Heart:<\/b> As you look back over the images in all of Mark, which one will stay with you? Why?"}],"prayer":"Father in heaven, you raised Jesus from the dead and sent his followers into all the world (16:6, 15). Give me wisdom as I read, and give me courage to tell others the good news."}],"discussion":{"intro":"Linking LIFE and SCRIPTURE using IMAGES is best done by asking questions. Visual Mark provides many such questions within the chapters. Below are ten types of image-based questions. These types and examples can help you craft your own questions as you lead group discussions and reflect personally on a passage.","types":[["Image to Story",null,["What story do you see in this image?","If an image is worth a thousand words, what words would you put with this image?"]],["Response to Image",null,["How do you respond to this image?","What emotions or feelings surface in you as you look at the picture?","How might these emotions link to your life story?"]],["Imaginations","a mental image, without looking at a picture",["As you consider the Bible story, how would you imagine it playing out?","How might you imagine yourself in that story?"]],["Link Image to Person",null,["If you put yourself in this picture, where would you be?","What would you be feeling? Thinking? Doing? Saying?","How might this image connect with your longings as a human being? (Consider longings such as: belong, intimacy, protect, provide, build, order, nurture, change, justice, mercy, explore, know, create, transcend.)","What message does this image convey? How might the image appeal to your decisions in life (choice of friends, career, purchases)?"]],["Link Image to Concept",null,["As you look at this image, how might it connect with the concept of grace, mercy, identity or power?","Consider these deep metaphors: balance, transformation, journey, container, connection, resource, control. (Gerald and Lindsay Zaltman, 2008). Which metaphor best relates to this image? Explain."]],["Link Image to Attractions, Aversions and Decisions",null,["Are you attracted to this image? If so, why? How do you usually manage your attractions?","Do you dislike this image? If so, why? How do you usually manage your aversions?","How might this image influence the way you make decisions?"]],["Link Image to God",null,["Where would you imagine God in this picture?","What is he doing? Thinking? Feeling? Saying? Explain why."]],["Link Image to Bible",null,["How do you see this image connecting with this passage?","What image might better connect with this passage for you?"]],["Link Image to Culture",null,["Our culture surrounds us with images. Which images in the past week relate to this passage? How did you respond to them?","What is the message of that image from the culture?","Does that cultural message align with the message of the Bible? Explain."]],["Link Image to Transformation",null,["As you reflect on this image and the passage, what surfaces in your heart? Where are you open to change, or closed to change?","How do this image and passage shape your view of God and his purposes? Is your heart aligned with God’s purposes?","How might this image encourage you in your daily walk with God?"]]]},"credits":[{"where":"Cover","desc":"A desert road running toward mountains under a colorful sunrise sky","page":"https://pixabay.com/photos/road-6719987/","user":""},{"where":"Welcome page","desc":"Hands holding a black Holy Bible","page":"https://pixabay.com/photos/holy-2598304/","user":""},{"where":"Welcome page","desc":"A single candle flame reflected in the dark","page":"https://pixabay.com/photos/jaya-4300005/","user":""},{"where":"Welcome page","desc":"Footprints along the shore toward the setting sun","page":"https://pixabay.com/photos/sea-4590986/","user":""},{"where":"Mark 1, opening photo","desc":"A road through barren desert hills in the wilderness","page":"https://pixabay.com/photos/israel-4792054/","user":""},{"where":"Mark 1, Jesus Is Baptized","desc":"Sunlight sparkling on rippling water","page":"https://pixabay.com/photos/lake-2120060/","user":""},{"where":"Mark 1, Jesus Calls Four Fishermen","desc":"A fisherman casting a net in a forest river","page":"https://pixabay.com/photos/man-5568023/","user":""},{"where":"Mark 1, Jesus Prays in a Quiet Place","desc":"A man kneeling in prayer at sunrise among the mountains","page":"https://pixabay.com/photos/praying-3602504/","user":""},{"where":"Mark 2, opening photo","desc":"Rescue workers carrying a person on a stretcher","page":"https://pixabay.com/photos/emergency-780313/","user":""},{"where":"Mark 2, Four Friends and a Paralyzed Man","desc":"Old clay tiles on a roof","page":"https://pixabay.com/photos/roof-8193787/","user":""},{"where":"Mark 2, Jesus Calls Levi","desc":"Friends sharing a meal around a table","page":"https://pixabay.com/photos/friends-581753/","user":""},{"where":"Mark 2, New Wine and New Wineskins","desc":"Rows of wooden barrels in a cellar","page":"https://pixabay.com/photos/winery-2110737/","user":""},{"where":"Mark 3, opening photo","desc":"A crowd of people walking through an old city street","page":"https://pixabay.com/photos/street-5703332/","user":""},{"where":"Mark 3, Healing on the Sabbath","desc":"Wrinkled old hands resting on a cane","page":"https://pixabay.com/photos/man-8060589/","user":""},{"where":"Mark 3, Jesus Chooses the Twelve","desc":"A group of students walking together along a street","page":"https://pixabay.com/photos/students-3982520/","user":""},{"where":"Mark 3, Jesus’ True Family","desc":"A family walking hand in hand along the beach","page":"https://pixabay.com/photos/family-6398107/","user":""},{"where":"Mark 4, opening photo","desc":"A farmer working a plowed field","page":"https://pixabay.com/photos/farmer-1367104/","user":""},{"where":"Mark 4, The Meaning of the Story","desc":"Young seedlings sprouting from the soil","page":"https://pixabay.com/photos/plant-4036131/","user":""},{"where":"Mark 4, A Lamp on a Stand","desc":"An ancient green clay oil lamp","page":"https://pixabay.com/photos/oil-lamp-946010/","user":""},{"where":"Mark 4, Jesus Calms the Storm","desc":"A small sailboat on a lake under a dark storm","page":"https://pixabay.com/photos/lake-3467108/","user":""},{"where":"Mark 5, opening photo","desc":"A heap of heavy rusty chains","page":"https://pixabay.com/photos/chains-109302/","user":""},{"where":"Mark 5, A Man Set Free","desc":"Tombs cut into a rock cliff","page":"https://pixabay.com/photos/petra-2067946/","user":""},{"where":"Mark 5, A Woman Touches Jesus’ Cloak","desc":"A hand reaching toward the light in a blue sky","page":"https://pixabay.com/photos/hands-1384735/","user":""},{"where":"Mark 5, Jairus’s Daughter Lives","desc":"A smiling young girl with braided hair","page":"https://pixabay.com/photos/girl-1871104/","user":""},{"where":"Mark 6, opening photo","desc":"Carpenter’s chisels on a wooden bench","page":"https://pixabay.com/photos/chisels-5224029/","user":""},{"where":"Mark 6, Jesus Sends Out the Twelve","desc":"A dusty dirt road in golden light","page":"https://pixabay.com/photos/road-7400333/","user":""},{"where":"Mark 6, Jesus Feeds Five Thousand","desc":"A basket with bread, fish and fruit", rse salt in a spoon","page":"https://pixabay.com/photos/salt-9090374/","user":""},{"where":"Mark 10, opening photo","desc":"A groom placing a ring on his bride’s finger","page":"https://pixabay.com/photos/couple-8342763/","user":""},{"where":"Mark 10, Jesus Welcomes the Children","desc":"A little girl running across the grass","page":"https://pixabay.com/photos/child-1728836/","user":""},{"where":"Mark 10, The Rich Man","desc":"A pile of gold coins","page":"https://pixabay.com/photos/gold-1633073/","user":""},{"where":"Mark 10, Blind Bartimaeus Receives His Sight","desc":"An old man sitting by a stone wall beside his donkey","page":"https://pixabay.com/photos/bedouin-476957/","user":""},{"where":"Mark 11, opening photo","desc":"Palm branches against a blue sky","page":"https://pixabay.com/photos/tree-2387629/","user":""},{"where":"Mark 11, Jesus Enters Jerusalem","desc":"A young donkey resting in a field","page":"https://pixabay.com/photos/donkey-6169088/","user":""},{"where":"Mark 11, A Fig Tree Without Fruit","desc":"Fig tree branches full of leaves","page":"https://pixabay.com/photos/fig-tree-4261401/","user":""},{"where":"Mark 11, Faith That Moves Mountains","desc":"A mountain reflected in a still lake","page":"https://pixabay.com/photos/mountains-1624284/","user":""},{"where":"Mark 12, opening photo","desc":"Rows of grapevines in a vineyard","page":"https://pixabay.com/photos/vineyard-4566852/","user":""},{"where":"Mark 12, Taxes to Caesar","desc":"Old silver coins stamped with faces","page":"https://pixabay.com/photos/coins-3298260/","user":""},{"where":"Mark 12, The Greatest Commandment","desc":"Hands holding a red heart","page":"https://pixabay.com/photos/feeling-2446129/","user":""},{"where":"Mark 12, The Widow’s Gift","desc":"A hand holding a few small coins","page":"https://pixabay.com/photos/coins-5696427/","user":""},{"where":"Mark 13, opening photo","desc":"Ruins of an ancient stone temple","page":"https://pixabay.com/photos/temple-3657496/","user":""},{"where":"Mark 13, Days of Distress","desc":"Lightning in dark storm clouds","page":"https://pixabay.com/photos/thunderstorm-3441687/","user":""},{"where":"Mark 13, The Coming of the Son of Man","desc":"Fresh new leaves budding on a fig branch","page":"https://pixabay.com/photos/fig-5311522/","user":""},{"where":"Mark 13, Stay Awake","desc":"A man carrying a lantern through the dark","page":"https://pixabay.com/photos/man-4449921/","user":""},{"where":"Mark 14, opening photo","desc":"A carved alabaster jar","page":"https://pixabay.com/photos/alabaster-1050820/","user":""},{"where":"Mark 14, The Lord’s Supper","desc":"Bread and a cup of wine on a cloth","page":"https://pixabay.com/photos/last-supper-2683532/","user":""},{"where":"Mark 14, Jesus Prays in Gethsemane","desc":"The twisted trunk of an ancient olive tree","page":"https://pixabay.com/photos/olive-tree-333973/","user":""},{"where":"Mark 14, Peter Denies Jesus","desc":"A rooster perched on a branch","page":"https://pixabay.com/photos/chicken-8402334/","user":""},{"where":"Mark 15, opening photo","desc":"A crown of thorns on purple cloth","page":"https://pixabay.com/photos/crown-of-thorns-2641239/","user":""},{"where":"Mark 15, The Crucifixion","desc":"Three crosses against the sunset","page":"https://pixabay.com/photos/easter-4226499/","user":""},{"where":"Mark 15, The Death of Jesus","desc":"A dim sun behind dark clouds","page":"https://pixabay.com/photos/sun-4639070/","user":""},{"where":"Mark 15, The Burial of Jesus","desc":"A tomb entrance cut into rock","page":"https://pixabay.com/photos/cyprus-2715318/","user":""},{"where":"Mark 16, opening photo","desc":"A rock tomb with its round stone rolled aside","page":"https://pixabay.com/photos/grave-2115941/","user":""},{"where":"Mark 16, Jesus Appears to Mary Magdalene","desc":"Three people singing joyfully with arms raised","page":"https://pixabay.com/photos/singing-7359018/","user":""},{"where":"Mark 16, Jesus Sends Out His Followers","desc":"A map of the world lit at night","page":"https://pixabay.com/photos/wikiimages-earth-11595/","user":""},{"where":"Mark 16, Jesus Is Taken Up to Heaven","desc":"Sunbeams breaking through clouds over green hills","page":"https://pixabay.com/photos/sunset-3325080/","user":""}],"master":{"welcome":"Master Questions. Three questions go with you through the whole book. You will find them again at the end of every chapter, with a box for your response, and the Summary after Mark 16 reviews them for the whole book. Responses and highlights are kept on this device only.","after":2,"chapter":"Step back and look at Mark {n} as a whole.","items":[["head","HEAD","What was the historical and cultural context of the original readers? What did this passage mean to them? (Context can be hard to know for sure, but it is important and helpful to consider.)"],["heart","HEART","What does this passage reveal about who God is? How does my heart respond to who He is? Is my heart open to Him as He reveals Himself? Am I judging God?"],["action","ACTION","What actions is God impressing on me to take? What should I carry with me into the future from this book?"]]},"summary":{"img":null,"intro":"You have read all 16 chapters of Mark. This Summary looks back over the whole book through the three Master Questions. Read each review, then write your own response in the boxes at the end.","respond":"Now answer the Master Questions for the whole Gospel of Mark.","parts":[["head","Here is what we can say about the people who first read Mark.",[["Written for believers far from Galilee","Early church writers say that Mark wrote down what the apostle Peter preached, and that he wrote in Rome. Mark explains Jewish customs for readers who did not know them (7:3–4) and translates Aramaic words, such as “Talitha cumi!” (5:41), so many of his first readers were probably Gentile Christians."],["A church under pressure","Many scholars date Mark to the 60s A.D., when Christians in Rome suffered under the emperor Nero. Jesus’ warning would have spoken directly to them: “You will be hated by all men for my name’s sake, but he who endures to the end will be saved” (13:13)."],["What the book meant to them","Mark showed them a Messiah who suffered. Jesus said, “Whoever wants to come after me, let him deny himself, and take up his cross, and follow me” (8:34). Their suffering did not mean God had left them. It meant they were walking the road their Lord had walked."],["Good news for Romans too","Readers in Rome would notice who speaks at the cross. A Roman centurion said, “Truly this man was the Son of God!” (15:39). The good news was for them as well."]],"Knowing their world helps you hear Mark as they did. Then ask what God is saying to you through it."],["heart","In the storm the disciples asked, “Who then is this, that even the wind and the sea obey him?” (4:41). Here is what Mark shows about who God is in Jesus.",[["The beloved Son","At Jesus’ baptism a voice came from heaven: “You are my beloved Son, in whom I am well pleased” (1:11)."],["Powerful over storm, sickness and death","Jesus calmed the wind and the sea with a word (4:39). He took a girl who had died by the hand and said, “Girl, I tell you, get up!” (5:41)."],["Full of compassion","Moved with compassion, Jesus touched a man with leprosy (1:41). When he saw the crowds, “he had compassion on them, because they were like sheep without a shepherd” (6:34)."],["He forgives sins","Jesus said that “the Son of Man has authority on earth to forgive sins” (2:10)."],["He came to serve and to give his life","“For the Son of Man also came not to be served, but to serve, and to give his life as a ransom for many” (10:45)."],["He does not give up on those who fail","After Peter denied Jesus three times, the angel at the tomb said, “Go, tell his disciples and Peter” (16:7)."]],"Am I judging God? The people of Nazareth “were offended at him” (6:3). The disciples in the storm cried, “Teacher, don’t you care that we are dying?” (4:38). How does your heart respond to who Jesus is? Is your heart open to him, or are you judging him?"],["action","Mark’s story ends with a command to go and tell. Here are steps the book impresses on its readers.",[["Repent and believe","“The time is fulfilled, and God’s Kingdom is at hand! Repent, and believe in the Good News” (1:15)."],["Follow Jesus","“Come after me, and I will make you into fishers for men” (1:17)."],["Take up your cross","“Whoever will lose his life for my sake and the sake of the Good News will save it” (8:35)."],["Serve others","“Whoever wants to become great among you shall be your servant” (10:43)."],["Pray and trust","“Have faith in God” (11:22). In his hardest hour Jesus prayed, “Not what I desire, but what you desire” (14:36)."],["Stay alert","“What I tell you, I tell all: Watch” (13:37)."],["Go and tell","“Go into all the world, and preach the Good News to the whole creation” (16:15)."]],"Carry this with you: Jesus is the Son of God who came to serve and to give his life for you. “Don’t be afraid, only believe” (5:36)."]]},"deeper":{"img":null,"intro":"Going Deeper is a short study guide to the whole Gospel of Mark. Use it after you finish reading, or alongside it, to see the big picture: who wrote Mark and when, the world it comes from, how the book is built, the themes and emotions that run through it, and free websites for further study.","sections":[["overview","Author and book overview"],["history","Historical and cultural insights"],["chart","Chart of the book"],["themes","Major themes and emotions"],["resources","Free resources online"]],"overviewLead":"Mark is the shortest of the four Gospels and probably the earliest. It tells the good news about Jesus with speed and vivid detail, moving quickly from his baptism to the cross and the empty tomb.","overview":[["Title","The book opens, “The beginning of the Good News of Jesus Christ, the Son of God” (1:1). The title “According to Mark” was added by the early church."],["Author","John Mark, whose mother’s house in Jerusalem was a meeting place for believers (Acts 12:12). He helped Paul and Barnabas, and Peter called him “Mark, my son” (1 Peter 5:13). Early church writers, beginning with Papias in the early 100s A.D., say Mark wrote down Peter’s preaching."],["Date","Most scholars date Mark to the late 50s or the 60s A.D., before the temple in Jerusalem was destroyed in A.D. 70."],["Place and readers","Early tradition says Mark wrote in Rome. He explains Jewish customs (7:3–4) and translates Aramaic words, which suggests that many of his readers were Gentiles."],["Purpose","To show who Jesus is, “the Christ” (8:29) and “the Son of God” (15:39), and what it means to follow him on the way of the cross."],["Key verses","1:1; 1:15; 8:29; 8:34; 10:45; 15:39; 16:6."],["Mark in the New Testament","Mark left Paul and Barnabas on their first journey (Acts 13:13), which later caused a sharp disagreement (Acts 15:37–39). Years afterward Paul wrote, “Take Mark, and bring him with you, for he is useful to me for service” (2 Timothy 4:11)."],["The ending","The oldest manuscripts end at 16:8. Verses 9–20 appear in most later manuscripts. The World English Bible includes them, and so does Visual Mark."]],"history":[["Under Roman rule","Rome ruled the land. Herod Antipas governed Galilee for Rome (6:14–29), and the Roman governor Pontius Pilate sentenced Jesus (15:1–15)."],["Life by the Sea of Galilee","Much of Jesus’ work in Mark happens around the Sea of Galilee, a lake about 13 miles (21 km) long. Fishing was a major business there, and sudden storms were common (4:37)."],["Synagogue and Sabbath","Jewish towns gathered in the synagogue on the Sabbath to hear Scripture read and taught (1:21). Jesus’ healings on the Sabbath brought conflict with the Pharisees (3:1–6)."],["Religious leaders","Pharisees stressed careful keeping of the law and the traditions of the elders (7:3–5). Scribes were experts in the law. Sadducees, from the leading priestly families, said there is no resurrection (12:18)."],["Clean and unclean","The law treated leprosy, bleeding and contact with the dead as making a person unclean. Jesus touched a man with leprosy (1:41), let a bleeding woman touch him (5:27) and took a dead girl by the hand (5:41)."],["Tax collectors","Tax collectors such as Levi gathered money for Rome or for Herod and were often treated as traitors and sinners (2:14–16)."],["Aramaic words","Jesus spoke Aramaic. Mark keeps some of his words and translates them: “Talitha cumi!” (5:41), “Ephphatha!” (7:34) and “Eloi, Eloi, lama sabachthani?” (15:34)."],["Roman words and money","Mark uses Latin words such as “Legion” (5:9) and “centurion” (15:39), and he explains that the widow’s two small coins “equal a quadrans coin” (12:42), signs of readers who knew Roman ways."],["Passover in Jerusalem","Passover remembered Israel’s rescue from Egypt. Jerusalem filled with pilgrims, and Jesus ate the Passover meal with his disciples the night before he died (14:12–25)."],["Crucifixion and burial","Crucifixion was Rome’s cruelest punishment, used for slaves and rebels. Tombs were often cut into rock and closed with a large stone (15:46; 16:3–4)."]],"chart":[["Beginning","1:1–13",1,13,"John prepares the way. Jesus is baptized and tested in the wilderness.","1:11","“You are my beloved Son, in whom I am well pleased.”"],["Ministry in Galilee","1:14–3:6",1,66,"Jesus calls disciples, heals, forgives sins and meets opposition.","1:15","“The time is fulfilled, and God’s Kingdom is at hand!”"],["Teaching and wonders","3:7–6:6",3,119,"Jesus chooses the Twelve, teaches in parables and calms the storm.","4:41","“Who then is this, that even the wind and the sea obey him?”"],["Beyond Galilee","6:7–8:26",6,113,"The Twelve are sent out. Jesus feeds great crowds and reaches Gentiles.","8:21","“Don’t you understand yet?”"],["On the way to the cross","8:27–10:52",8,114,"Peter confesses that Jesus is the Christ. Jesus three times predicts his death.","10:45","“For the Son of Man also came not to be served, but to serve”"],["Jesus in Jerusalem","11:1–13:37",11,114,"Jesus enters Jerusalem, clears the temple and teaches about the end.","11:9","“Hosanna! Blessed is he who comes in the name of the Lord!”"],["Suffering and death","14:1–15:47",14,119,"Jesus is anointed, betrayed, tried and crucified.","15:39","“Truly this man was the Son of God!”"],["Resurrection","16:1–20",16,20,"The tomb is empty. The risen Jesus sends his followers into all the world.","16:6","“He has risen. He is not here.”"]],"chartLead":"The whole Gospel of Mark, drawn to scale by verses. Tap a color to open that part of the book.","chartLabel":"Chart of the Gospel of Mark","ticks":[["Mark 1",0],["4",18.95],["8",44.84],["12",70.8],["16",100]],"refHead":"Passage","refWord":"Mark","roundsTitle":"Three times Jesus predicts his death","roundsHead":["Prediction","Jesus says","The disciples respond","Jesus teaches"],"roundsEmph":[1],"rounds":[["First","8:31","Peter rebukes him (8:32)","Take up your cross and follow me (8:34)"],["Second","9:31","They argue about who is the greatest (9:34)","Be last of all and servant of all (9:35)"],["Third","10:33–34","James and John ask for the best seats (10:37)","Whoever wants to be great must serve (10:43–45)"]],"roundsNote":"Each time Jesus speaks of his suffering, the disciples misunderstand, and each time he teaches them what it means to follow him.","themes":[["Who is Jesus?","Mark opens by calling Jesus “the Son of God” (1:1). The disciples’ question in the storm (4:41) runs through the book until Peter says, “You are the Christ” (8:29), and a Roman centurion says, “Truly this man was the Son of God!” (15:39)."],["God’s Kingdom has come near","Jesus announces that “God’s Kingdom is at hand” (1:15) and shows its power by healing, forgiving and setting people free."],["The suffering servant","The Messiah came to suffer, die and rise again (8:31), and “to give his life as a ransom for many” (10:45)."],["Following Jesus","Following Jesus means leaving things behind, taking up the cross and serving others (8:34; 10:43–45)."],["Faith instead of fear","Again and again Jesus asks people to trust him rather than fear: “Don’t be afraid, only believe” (5:36). Even his closest followers struggle to believe."],["Good news for all nations","Jesus crosses into Gentile lands (5:1–20; 7:24–31) and calls the temple “a house of prayer for all the nations” (11:17)."]],"emotionsTitle":"Emotions: the heart of Jesus","emotionsLead":"Mark tells us more about Jesus’ feelings than any other Gospel. Follow them through the book, and let them show you his heart, and the hearts of the people around him.","emotions":[["Compassion","1:41; 6:34"],["Anger and grief","3:5"],["Amazed at unbelief","6:6"],["Deep sighs","7:34; 8:12"],["Indignation","10:14"],["Love","10:21"],["Sorrow and distress","14:33–34"],["Forsaken","15:34"],["Fear and wonder at the empty tomb","16:8"]],"resourcesLead":"These free websites can help you study Mark further. They are independent of Visual Mark, and you need an internet connection to open them.","resources":[["Blue Letter Bible: Mark with Greek word study","https://www.blueletterbible.org/kjv/mar/1/1/ss1","Read Mark with Strong’s numbers linked to Greek definitions, plus cross-references and commentaries for every verse."],["Blue Letter Bible: Introduction to Mark","https://www.blueletterbible.org/esv-study-bible/new-testament/introductions/introduction-to-mark.cfm","The ESV Global Study Bible’s introduction, with author, date, themes and an outline of the book."],["Blue Letter Bible: Executable Outlines on Mark","https://www.blueletterbible.org/study/eo/Mar/Mar000.cfm","A short introduction, outlines and review questions, useful for group study."],["Matthew Henry’s Commentary on Mark","https://www.biblegateway.com/resources/matthew-henry/Mark","A classic devotional commentary from the early 1700s, chapter by chapter."],["Enduring Word Commentary on Mark","https://enduringword.com/bible-commentary/mark-1/","David Guzik’s verse-by-verse commentary, with audio teaching on each section."],["BibleProject: Overview of Mark","https://bibleproject.com/explore/video/mark/","A short animated video on the design and message of the book."],["Blue Letter Bible: Map of the setting of Mark","https://www.blueletterbible.org/esv-study-bible/new-testament/maps/the-setting-of-mark.cfm","A map of Galilee, Judea and the surrounding regions where the events of Mark take place."],["OpenBible.info: Map of places in Mark","https://www.openbible.info/geo/mark","An interactive map of the places named in Mark, such as Capernaum, Bethsaida, Jericho and Jerusalem."]]},"stats":{"questions":139,"photos":64,"chapters":16}}</script>
<script>
(function () {
  "use strict";
  var BOOK = JSON.parse(document.getElementById("book-data").textContent);
  var CH = BOOK.chapters;
  var main = document.getElementById("main");

  /* ---------- storage (one browser only) ---------- */
  var KEY = "visual-mark.responses.v1";
  var OLD_KEYS = [];
  var PREF = "visual-mark.prefs.v1";
  var IN_FRAME = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var STANDALONE = window.navigator.standalone === true || (!!window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  var IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (STANDALONE) document.documentElement.classList.add("standalone");
  var SHARE_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-label="Share"><path d="M8 1.5v8M5 4.5l3-3 3 3M4.5 7H3.5v7h9V7h-1" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var store = null;
  try { var t = "__vl"; window.localStorage.setItem(t, "1"); window.localStorage.removeItem(t); store = window.localStorage; } catch (e) { store = null; }
  function readJSON(k) { if (!store) return {}; try { return JSON.parse(store.getItem(k) || "{}") || {}; } catch (e) { return {}; } }
  function writeJSON(k, v) { if (!store) return false; try { store.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  if (store) OLD_KEYS.forEach(function (k) { try { store.removeItem(k); } catch (e) {} });
  var responses = readJSON(KEY);
  var prefs = readJSON(PREF);

  /* ---------- indexes ---------- */
  var QUESTIONS = [];
  CH.forEach(function (c) {
    c.sections = [];
    c.questions = [];
    c.blocks.forEach(function (b, i) {
      b.domId = "c" + c.num + "-b" + i;
      if (b.type === "h2") c.sections.push({ text: b.text, id: b.domId });
      if (b.type === "q") { var q = { ch: c.num, id: b.id, field: b.field, text: b.text, domId: b.domId }; c.questions.push(q); QUESTIONS.push(q); }
    });
  });
  var MQ = BOOK.master.items;
  var MQFIELDS = [];
  CH.forEach(function (c) {
    c.mq = MQ.map(function (m) { var f = { ch: c.num, key: m[0], label: m[1], text: m[2], field: "mq" + c.num + "-" + m[0], domId: "c" + c.num + "-mq-" + m[0] }; MQFIELDS.push(f); return f; });
  });
  var SUMQ = MQ.map(function (m) { var f = { ch: "summary", key: m[0], label: m[1], text: m[2], field: "mqs-" + m[0], domId: "sum-" + m[0] }; MQFIELDS.push(f); return f; });
  function answered(field) { return !!(responses[field] && responses[field].trim()); }
  function mqAnswered() { return MQFIELDS.filter(function (q) { return answered(q.field); }).length; }
  function answeredIn(c) { return c.questions.filter(function (q) { return answered(q.field); }).length; }
  function totalAnswered() { return QUESTIONS.filter(function (q) { return answered(q.field); }).length; }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function strip(h) { return String(h).replace(/<sup class="v">(\d+)<\/sup>/g, "$1").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">"); }
  function img(src, w, h, alt, cls, eager) {
    return '<img src="' + esc(src) + '" width="' + w + '" height="' + h + '" alt="' + esc(alt || "") + '"' +
      (cls ? ' class="' + cls + '"' : "") + (eager ? "" : ' loading="lazy" decoding="async"') + ">";
  }

  /* ---------- chrome ---------- */
  var chapgrid = document.getElementById("chapgrid");
  var chapmenu = document.getElementById("chapmenu");
  ["nav-deeper", "nav-summary"].forEach(function (id) { document.getElementById(id).addEventListener("click", function () { chapmenu.open = false; }); });
  function renderChapGrid(current) {
    chapgrid.innerHTML = CH.map(function (c) {
      var a = answeredIn(c);
      return '<a href="#mark-' + c.num + '"' + (current === c.num ? ' aria-current="page"' : "") + (a ? ' class="done"' : "") +
        ' title="Mark ' + c.num + (a ? " · " + a + " answered" : "") + '">' + c.num + "</a>";
    }).join("");
  }
  function updateCount() { document.getElementById("resp-count").textContent = totalAnswered() + mqAnswered(); }
  document.addEventListener("click", function (e) {
    if (chapmenu.open && !chapmenu.contains(e.target)) chapmenu.open = false;
  });
  chapgrid.addEventListener("click", function () { chapmenu.open = false; });

  /* ---------- search ---------- */
  var SEARCH = [];
  CH.forEach(function (c) {
    var section = "";
    c.blocks.forEach(function (b) {
      if (b.type === "h2") { section = b.text; SEARCH.push({ ch: c.num, domId: b.domId, kind: "Heading", text: strip(b.text), section: section }); }
      else if (b.type === "p") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Text", text: strip(b.html), section: section });
      else if (b.type === "poem") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Text", text: strip(b.lines.join(" ")), section: section });
      else if (b.type === "q") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Question " + b.id, text: strip(b.text), section: section });
    });
  });
  SEARCH.forEach(function (s) { s.lower = s.text.toLowerCase(); });
  var searchBtn = document.getElementById("search-btn");
  var searchbar = document.getElementById("searchbar");
  var searchInput = document.getElementById("search-input");
  var resultsEl = document.getElementById("results");
  var noteEl = document.getElementById("results-note");
  searchBtn.addEventListener("click", function () {
    var open = searchbar.hidden;
    searchbar.hidden = !open;
    searchBtn.setAttribute("aria-expanded", String(open));
    if (open) searchInput.focus();
  });
  function snippet(text, q) {
    var i = text.toLowerCase().indexOf(q);
    var start = Math.max(0, i - 70), end = Math.min(text.length, i + q.length + 110);
    var s = (start > 0 ? "…" : "") + esc(text.slice(start, i)) + "<b>" + esc(text.slice(i, i + q.length)) + "</b>" + esc(text.slice(i + q.length, end)) + (end < text.length ? "…" : "");
    return s;
  }
  var searchTimer;
  searchInput.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 120);
  });
  searchInput.addEventListener("keydown", function (e) { if (e.key === "Escape") { searchbar.hidden = true; searchBtn.setAttribute("aria-expanded", "false"); searchBtn.focus(); } });
  function runSearch() {
    var q = searchInput.value.trim().toLowerCase();
    if (q.length < 2) { resultsEl.innerHTML = ""; noteEl.textContent = q ? "Type at least two letters." : ""; return; }
    var hits = SEARCH.filter(function (s) { return s.lower.indexOf(q) !== -1; });
    var shown = hits.slice(0, 60);
    resultsEl.innerHTML = shown.map(function (h, i) {
      return '<li><button type="button" data-i="' + i + '"><span class="ref">Mark ' + h.ch + " · " + esc(h.kind) + (h.section && h.kind !== "Heading" ? " · " + esc(h.section) : "") + "</span>" + snippet(h.text, q) + "</button></li>";
    }).join("");
    noteEl.textContent = hits.length ? (hits.length > shown.length ? "Showing the first " + shown.length + " of " + hits.length + " matches." : hits.length + (hits.length === 1 ? " match." : " matches.")) : "No matches in Mark or the questions.";
    resultsEl.onclick = function (e) {
      var b = e.target.closest("button[data-i]"); if (!b) return;
      var h = shown[+b.getAttribute("data-i")];
      searchbar.hidden = true; searchBtn.setAttribute("aria-expanded", "false");
      goTo(h.ch, h.domId);
    };
  }

  /* ---------- navigation ---------- */
  var pendingTarget = null;
  function goTo(ch, domId) {
    pendingTarget = domId;
    var want = ch === "summary" ? "#summary" : "#mark-" + ch;
    if (location.hash === want) { scrollToTarget(); } else { location.hash = want; }
  }
  function scrollToTarget() {
    if (!pendingTarget) return;
    var el = document.getElementById(pendingTarget);
    pendingTarget = null;
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    var ta = el.querySelector && el.querySelector("textarea");
    if (ta) ta.focus({ preventScroll: true });
    try {
      var soft = getComputedStyle(document.documentElement).getPropertyValue("--teal-soft").trim();
      if (el.animate && soft && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) el.animate([{ backgroundColor: soft }, { backgroundColor: "transparent" }], { duration: 1600 });
    } catch (e) {}
  }

  function setNav(view) {
    document.getElementById("nav-discussion").toggleAttribute("aria-current", false);
    document.getElementById("nav-responses").toggleAttribute("aria-current", false);
    if (view === "discussion") document.getElementById("nav-discussion").setAttribute("aria-current", "page");
    if (view === "responses") document.getElementById("nav-responses").setAttribute("aria-current", "page");
    ["deeper", "summary"].forEach(function (v) { var el = document.getElementById("nav-" + v); if (view === v) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current"); });
  }

  var visits = 0, currentChapter = 0, resume = false;
  var backBtn = document.getElementById("back-btn");
  backBtn.addEventListener("click", function () {
    if (visits > 1) { visits -= 2; history.back(); } else { location.hash = "#home"; }
  });
  function route() {
    var h = location.hash.replace(/^#/, "");
    var m = /^mark-(\d+)$/.exec(h);
    visits++;
    chapmenu.open = false;
    hideBar();
    currentChapter = 0;
    backBtn.hidden = !(h && h !== "home");
    if (m && +m[1] >= 1 && +m[1] <= CH.length) { currentChapter = +m[1]; renderChapter(+m[1]); setNav("chapter"); }
    else if (h === "credits") { renderCredits(); setNav("credits"); renderChapGrid(0); document.title = "Photo credits · Visual Mark"; }
    else if (h === "install") { renderInstall(); setNav("install"); renderChapGrid(0); document.title = "Install · Visual Mark"; }

      if (!qs.length && !ms.length) return;
      lines.push("MARK " + c.num);

        lines.push(q.id + "  " + strip(q.text));

        lines.push("");

        lines.push("Master Question · " + f.label + "  " + strip(f.text));

    if (ss.length) {
      lines.push("SUMMARY");

        lines.push("Master Question · " + f.label + "  " + strip(f.text));

    if (m) {
      var sel = window.getSelection();
      if (sel && !sel.isCollapsed) return;
      hlMode = { kind: "edit", id: m.getAttribute("data-hl"), el: m };
      showBar();
      return;
    }
    var clr = e.target.closest && e.target.closest("[data-hl-clear]");
    if (clr) {
      var scope = clr.getAttribute("data-hl-clear");
      var list = scope === "chapter" ? hlFor(currentChapter) : HL.slice();
      removeHL(list, plural(list.length, "highlight") + " cleared" + (scope === "chapter" ? " from Mark " + currentChapter : "") + ".");
      return;
    }
    var del = e.target.closest && e.target.closest("[data-hl-del]");
    if (del) { var h = findHL(del.getAttribute("data-hl-del")); if (h) removeHL([h], "Highlight removed."); }
  });
  document.addEventListener("click", function (e) {
    if (hlbar.hidden || !hlMode) return;
    if (hlbar.contains(e.target) || (e.target.closest && e.target.closest("mark.hl"))) return;
    var sel = window.getSelection();
    if (hlMode.kind === "edit" || !sel || sel.isCollapsed) hideBar();
  });
  var barRAF = 0;
  window.addEventListener("scroll", function () {
    if (!hlMode) return;
    if (barRAF) return;
    barRAF = requestAnimationFrame(function () { barRAF = 0; if (hlMode) placeBar(); });
  }, { passive: true });
  window.addEventListener("resize", function () { if (hlMode) placeBar(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && hlMode) hideBar(); });

  /* ---------- toast ---------- */
  var toastTimer = null;
  function showToast(text, label, onClick, ms) {
    var t = document.getElementById("toast");
    clearTimeout(toastTimer);
    document.getElementById("toast-text").textContent = text;
    var b = document.getElementById("toast-btn");
    b.textContent = label; b.onclick = function () { clearTimeout(toastTimer); t.hidden = true; onClick(); };
    t.hidden = false;
    if (ms) toastTimer = setTimeout(function () { t.hidden = true; }, ms);
  }

  /* ---------- offline app (service worker) ---------- */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !IN_FRAME) {
    var hadController = !!navigator.serviceWorker.controller, updating = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (hadController && updating) location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        function offer(worker) {
          showToast("A new version of Visual Mark is ready.", "Update", function () { updating = true; worker.postMessage("skipWaiting"); });
        }
        if (reg.waiting && hadController) offer(reg.waiting);
        reg.addEventListener("updatefound", function () {
          var nw = reg.installing; if (!nw) return;
          nw.addEventListener("statechange", function () {
            if (nw.state === "installed" && navigator.serviceWorker.controller) offer(nw);
          });
        });
      }).catch(function () {});
      if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
    });
  }

  // home-screen card, continue button (delegated, since views re-render)
  main.addEventListener("click", function (e) {
    if (e.target.closest("#install-dismiss")) {
      prefs.hideInstall = true; writeJSON(PREF, prefs);
      var c = document.getElementById("install-card"); if (c) c.remove();
    }
    if (e.target.closest("#continue-btn")) resume = true;
  });

  // keyboard: [ and ] for previous/next chapter when not typing
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("textarea, input")) return;
    var m = /^#mark-(\d+)$/.exec(location.hash);
    if (!m) return;
    var n = +m[1];
    if (e.key === "]" && n < CH.length) location.hash = "#mark-" + (n + 1);
    if (e.key === "[" && n > 1) location.hash = "#mark-" + (n - 1);
  });

  route();
})();
</script>
</body>
</html>
